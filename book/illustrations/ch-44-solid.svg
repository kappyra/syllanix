<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img"
     aria-labelledby="solid-title solid-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="solid-title">Пять принципов SOLID</title>
  <desc id="solid-desc">Пять принципов проектирования: единственная ответственность, открытость для расширения и закрытость для изменения, подстановочность Лисков, разделение интерфейсов и инверсия зависимостей. Для каждого принципа указано, какая проблема возникает без него. Принципы помогают принимать решения, но не заменяют их.</desc>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1d3550">SOLID: пять принципов</text>
  <text x="40" y="58" font-size="13" fill="#33557a">Эвристики для распределения ответственностей и зависимостей, а не законы.</text>

  <!-- S -->
  <rect x="40" y="80" width="250" height="160" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="60" y="118" font-size="26" font-weight="bold" fill="#33557a">S</text>
  <text x="60" y="144" font-size="14" font-weight="bold" fill="#1d3550">Единственная</text>
  <text x="60" y="164" font-size="14" font-weight="bold" fill="#1d3550">ответственность</text>
  <text x="60" y="190" font-size="12" fill="#33557a">одна причина для изменения —</text>
  <text x="60" y="208" font-size="12" fill="#33557a">одна группа требований</text>
  <text x="60" y="230" font-size="11" fill="#8c2f2f">без него: меняется по всем поводам</text>

  <!-- O -->
  <rect x="305" y="80" width="250" height="160" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="1.8"/>
  <text x="325" y="118" font-size="26" font-weight="bold" fill="#8a6a2f">O</text>
  <text x="325" y="144" font-size="14" font-weight="bold" fill="#4b3a16">Открытость для</text>
  <text x="325" y="164" font-size="14" font-weight="bold" fill="#4b3a16">расширения</text>
  <text x="325" y="190" font-size="12" fill="#4b3a16">новое поведение — новый код,</text>
  <text x="325" y="208" font-size="12" fill="#4b3a16">а не правка старого</text>
  <text x="325" y="230" font-size="11" fill="#8c2f2f">без него: цепочки if растут</text>

  <!-- L -->
  <rect x="570" y="80" width="250" height="160" rx="10" fill="#f2f6ee" stroke="#4a6b35" stroke-width="1.8"/>
  <text x="590" y="118" font-size="26" font-weight="bold" fill="#4a6b35">L</text>
  <text x="590" y="144" font-size="14" font-weight="bold" fill="#2f4a20">Подстановочность</text>
  <text x="590" y="164" font-size="14" font-weight="bold" fill="#2f4a20">Лисков</text>
  <text x="590" y="190" font-size="12" fill="#2f4a20">подкласс заменяет базовый,</text>
  <text x="590" y="208" font-size="12" fill="#2f4a20">не нарушая обещаний</text>
  <text x="590" y="230" font-size="11" fill="#8c2f2f">без него: клиент ломается</text>

  <!-- I -->
  <rect x="170" y="270" width="250" height="160" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="190" y="308" font-size="26" font-weight="bold" fill="#33557a">I</text>
  <text x="190" y="334" font-size="14" font-weight="bold" fill="#1d3550">Разделение</text>
  <text x="190" y="354" font-size="14" font-weight="bold" fill="#1d3550">интерфейсов</text>
  <text x="190" y="380" font-size="12" fill="#33557a">клиент зависит только от тех</text>
  <text x="190" y="398" font-size="12" fill="#33557a">методов, что использует</text>
  <text x="190" y="420" font-size="11" fill="#8c2f2f">без него: лишние методы</text>

  <!-- D -->
  <rect x="440" y="270" width="250" height="160" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="1.8"/>
  <text x="460" y="308" font-size="26" font-weight="bold" fill="#8a6a2f">D</text>
  <text x="460" y="334" font-size="14" font-weight="bold" fill="#4b3a16">Инверсия</text>
  <text x="460" y="354" font-size="14" font-weight="bold" fill="#4b3a16">зависимостей</text>
  <text x="460" y="380" font-size="12" fill="#4b3a16">и правило, и деталь зависят</text>
  <text x="460" y="398" font-size="12" fill="#4b3a16">от абстракции</text>
  <text x="460" y="420" font-size="11" fill="#8c2f2f">без него: правила тянут детали</text>
</svg>
