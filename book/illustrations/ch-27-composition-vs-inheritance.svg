<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img"
     aria-labelledby="ttl27b desc27b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl27b">Наследование и композиция: «частный случай» против «содержит»</title>
  <desc id="desc27b">Слева наследование: класс Dog — частный случай класса Animal и получает его методы. Справа композиция: класс Car содержит объект Engine и вызывает его метод start. Таблица внизу сравнивает отношения, выгоду и риск обоих подходов.</desc>

  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr27b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="28" y="30" font-size="17" font-weight="bold" fill="#1d3550">Два способа связать классы</text>

  <!-- наследование -->
  <rect x="28" y="52" width="400" height="184" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="44" y="78" font-size="14" font-weight="bold" fill="#1d3550">наследование: Dog → Animal</text>

  <rect x="120" y="94" width="200" height="42" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.4"/>
  <text x="220" y="120" text-anchor="middle" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">Animal: speak()</text>

  <rect x="120" y="164" width="200" height="42" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.4"/>
  <text x="220" y="190" text-anchor="middle" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">Dog: speak()</text>
  <path d="M220 164 L 220 140" fill="none" stroke="#33557a" stroke-width="2" marker-end="url(#arr27b)"/>

  <text x="44" y="224" font-size="12" fill="#33557a">Dog наследует методы Animal</text>

  <!-- композиция -->
  <rect x="452" y="52" width="400" height="184" rx="10" fill="#fdf3e3" stroke="#8a5a13" stroke-width="1.8"/>
  <text x="468" y="78" font-size="14" font-weight="bold" fill="#1d3550">композиция: Car содержит Engine</text>

  <rect x="480" y="94" width="200" height="42" rx="6" fill="#ffffff" stroke="#8a5a13" stroke-width="1.4"/>
  <text x="580" y="120" text-anchor="middle" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">Engine: start()</text>

  <rect x="480" y="164" width="200" height="42" rx="6" fill="#ffffff" stroke="#8a5a13" stroke-width="1.4"/>
  <text x="580" y="190" text-anchor="middle" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">Car: start()</text>
  <path d="M580 164 L 580 140" fill="none" stroke="#8a5a13" stroke-width="2" marker-end="url(#arr27b)"/>
  <text x="592" y="150" font-size="11" fill="#8a5a13">вызывает</text>

  <text x="468" y="224" font-size="12" fill="#8a5a13">Car использует Engine, но не наследует его</text>

  <!-- сравнение -->
  <line x1="28" y1="250" x2="852" y2="250" stroke="#c9d3e0" stroke-width="1.4"/>
  <text x="28" y="276" font-size="13" font-weight="bold" fill="#1d3550">Признак</text>
  <text x="230" y="276" font-size="13" font-weight="bold" fill="#1d3550">Наследование</text>
  <text x="540" y="276" font-size="13" font-weight="bold" fill="#1d3550">Композиция</text>

  <text x="28" y="306" font-size="13" fill="#1d3550">Отношение</text>
  <text x="230" y="306" font-size="13" fill="#33557a">«частный случай»</text>
  <text x="540" y="306" font-size="13" fill="#8a5a13">«содержит»</text>

  <text x="28" y="336" font-size="13" fill="#1d3550">Что даёт</text>
  <text x="230" y="336" font-size="13" fill="#33557a">поведение базового класса</text>
  <text x="540" y="336" font-size="13" fill="#8a5a13">делегирование вызовов</text>

  <text x="28" y="366" font-size="13" fill="#1d3550">Риск</text>
  <text x="230" y="366" font-size="13" fill="#33557a">жёсткая иерархия классов</text>
  <text x="540" y="366" font-size="13" fill="#8a5a13">больше кода-обёрток</text>

  <text x="28" y="404" font-size="13" fill="#1d3550">Выбор зависит от смысла связи, а не от удобства повторного использования.</text>
</svg>
