<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img"
     aria-labelledby="ttl18s desc18s" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl18s">Поверхностное и глубокое копирование вложенного списка</title>
  <desc id="desc18s">Оригинал — список из двух внутренних списков. При поверхностном копировании внешний список новый, но внутренние списки те же, поэтому изменение копии видно в оригинале. При глубоком копировании внутренние списки тоже новые, и копия независима.</desc>

  <text x="32" y="32" font-size="17" font-weight="bold" fill="#1d3550">Копия вложенного списка: что именно копируется</text>

  <!-- ===== поверхностное ===== -->
  <text x="32" y="62" font-size="14" font-weight="bold" fill="#8a3030">Поверхностное копирование: внутренние объекты общие</text>

  <rect x="36" y="88" width="150" height="44" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="111" y="116" text-anchor="middle" font-size="13" fill="#1d3550">оригинал: matrix</text>
  <rect x="36" y="152" width="150" height="44" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="111" y="180" text-anchor="middle" font-size="13" fill="#1d3550">копия: clone</text>

  <line x1="186" y1="110" x2="290" y2="110" stroke="#33557a" stroke-width="2"/>
  <polygon points="290,110 278,104 278,116" fill="#33557a"/>
  <line x1="186" y1="174" x2="290" y2="174" stroke="#33557a" stroke-width="2"/>
  <polygon points="290,174 278,168 278,180" fill="#33557a"/>

  <rect x="298" y="76" width="330" height="136" rx="10" fill="#fdf3f1" stroke="#8a3030" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="312" y="98" font-size="12" font-weight="bold" fill="#8a3030">те же внутренние списки (общие)</text>
  <rect x="312" y="110" width="140" height="40" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="382" y="136" text-anchor="middle" font-size="14" fill="#4b3a16">[1, 2]</text>
  <rect x="472" y="110" width="140" height="40" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="542" y="136" text-anchor="middle" font-size="14" fill="#4b3a16">[3, 4]</text>
  <text x="312" y="176" font-size="12" fill="#8a3030">clone[0] is matrix[0] → True</text>
  <text x="312" y="196" font-size="12" fill="#8a3030">clone[0][0] = 99 меняет и оригинал</text>

  <!-- ===== глубокое ===== -->
  <text x="32" y="256" font-size="14" font-weight="bold" fill="#2f6b3f">Глубокое копирование: копируются все уровни</text>

  <rect x="36" y="282" width="150" height="44" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="111" y="310" text-anchor="middle" font-size="13" fill="#1d3550">оригинал: matrix</text>
  <rect x="36" y="384" width="150" height="44" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="111" y="412" text-anchor="middle" font-size="13" fill="#1d3550">копия: deep</text>

  <line x1="186" y1="304" x2="290" y2="304" stroke="#33557a" stroke-width="2"/>
  <polygon points="290,304 278,298 278,310" fill="#33557a"/>
  <line x1="186" y1="406" x2="290" y2="406" stroke="#33557a" stroke-width="2"/>
  <polygon points="290,406 278,400 278,412" fill="#33557a"/>

  <rect x="298" y="272" width="330" height="76" rx="10" fill="#f1f8f2" stroke="#2f6b3f" stroke-width="2"/>
  <text x="312" y="292" font-size="12" font-weight="bold" fill="#2f6b3f">внутренние списки оригинала</text>
  <rect x="312" y="300" width="140" height="36" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="382" y="324" text-anchor="middle" font-size="14" fill="#4b3a16">[1, 2]</text>
  <rect x="472" y="300" width="140" height="36" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="542" y="324" text-anchor="middle" font-size="14" fill="#4b3a16">[3, 4]</text>

  <rect x="298" y="374" width="330" height="76" rx="10" fill="#f1f8f2" stroke="#2f6b3f" stroke-width="2"/>
  <text x="312" y="394" font-size="12" font-weight="bold" fill="#2f6b3f">новые внутренние списки копии</text>
  <rect x="312" y="402" width="140" height="36" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="382" y="426" text-anchor="middle" font-size="14" fill="#4b3a16">[1, 2]</text>
  <rect x="472" y="402" width="140" height="36" rx="7" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="542" y="426" text-anchor="middle" font-size="14" fill="#4b3a16">[3, 4]</text>

  <text x="32" y="472" font-size="12" fill="#5a6b7d">Копия в Python по умолчанию поверхностная: copy(), dict(), срез копируют только верхний уровень.</text>
  <text x="32" y="492" font-size="12" fill="#5a6b7d">Полную независимость даёт только copy.deepcopy из стандартной библиотеки.</text>
</svg>
