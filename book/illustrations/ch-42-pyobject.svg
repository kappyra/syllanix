<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img"
     aria-labelledby="pyobject-title pyobject-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="pyobject-title">Устройство объекта CPython и подсчёт ссылок</title>
  <desc id="pyobject-desc">Любой объект начинается с двух полей: счётчика ссылок и указателя на тип. Дальше хранятся данные значения. Две переменные a и b ссылаются на один объект, поэтому счётчик равен двум. Когда счётчик станет нулём, память вернётся распределителю; конкретное значение счётчика — деталь CPython.</desc>

  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1d3550">Из чего состоит объект</text>
  <text x="30" y="56" font-size="13" fill="#33557a">Имена ссылаются на объект; объект хранит счётчик, тип и данные.</text>

  <!-- переменные -->
  <rect x="100" y="78" width="70" height="34" rx="6" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="135" y="101" text-anchor="middle" font-size="14" fill="#1d3550">a</text>
  <rect x="200" y="78" width="70" height="34" rx="6" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="235" y="101" text-anchor="middle" font-size="14" fill="#1d3550">b</text>

  <line x1="135" y1="114" x2="135" y2="146" stroke="#33557a" stroke-width="2"/>
  <polygon points="135,150 128,140 142,140" fill="#33557a"/>
  <line x1="235" y1="114" x2="235" y2="146" stroke="#33557a" stroke-width="2"/>
  <polygon points="235,150 228,140 242,140" fill="#33557a"/>

  <!-- объект -->
  <rect x="60" y="150" width="320" height="44" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <text x="76" y="178" font-size="13" fill="#1d3550">ob_refcnt — счётчик ссылок</text>
  <text x="364" y="178" text-anchor="end" font-size="16" font-weight="bold" fill="#33557a">2</text>

  <rect x="60" y="196" width="320" height="44" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <text x="76" y="224" font-size="13" fill="#1d3550">ob_type — указатель на тип</text>

  <rect x="60" y="242" width="320" height="78" rx="6" fill="#f7f8fa" stroke="#33557a" stroke-width="1.8"/>
  <text x="76" y="266" font-size="13" fill="#1d3550">данные значения</text>
  <text x="76" y="288" font-size="12" fill="#33557a">для int — цифры числа</text>
  <text x="76" y="308" font-size="12" fill="#33557a">для списка — массив ссылок</text>

  <!-- тип -->
  <rect x="540" y="196" width="270" height="78" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="562" y="222" font-size="14" font-weight="bold" fill="#1d3550">тип: int</text>
  <text x="562" y="242" font-size="12" fill="#33557a">один тип на все целые числа</text>
  <text x="562" y="262" font-size="12" fill="#33557a">в CPython — структура PyLongObject</text>

  <line x1="382" y1="218" x2="534" y2="218" stroke="#33557a" stroke-width="2.2"/>
  <polygon points="538,218 528,212 528,224" fill="#33557a"/>
  <text x="458" y="208" text-anchor="middle" font-size="12" fill="#33557a">тип объекта</text>

  <!-- пояснения -->
  <text x="60" y="348" font-size="13" fill="#1d3550">Счётчик равен 2, потому что на объект ссылаются и a, и b.</text>

  <rect x="60" y="362" width="750" height="44" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4"/>
  <text x="76" y="382" font-size="12" fill="#8c2f2f">Значение счётчика и порядок освобождения — деталь CPython, а не гарантия языка.</text>
  <text x="76" y="400" font-size="12" fill="#2f4a20">Гарантия языка: у каждого объекта есть тип, а имя хранит ссылку на объект.</text>
</svg>
