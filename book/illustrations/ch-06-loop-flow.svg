<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title description">
  <title id="title">Как работают циклы while и for в Python</title>
  <desc id="description">Две отдельные схемы. Слева while: n равен 3; перед каждой итерацией проверяется n больше нуля; если да, выполняются print(n) и уменьшение n, затем условие проверяется снова; если нет, выполняется код после цикла. Справа for: range(1, 4) выдаёт значения 1, 2, 3; если следующее значение есть, оно присваивается i и печатается; если значения закончились, цикл завершается.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647d"/></marker>
  </defs>
  <rect width="960" height="550" rx="20" fill="#f1f5f9"/>
  <text x="26" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Два способа повторять действия</text>
  <text x="26" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Переходы показывают порядок исполнения, а не просто последовательность строк кода</text>
  <g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="70" width="450" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="36" y="88" width="82" height="27" rx="8" fill="#dcfce7"/>
    <text x="77" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">WHILE</text>
    <text x="132" y="106" font-size="14" fill="#334155">проверка условия</text>
    <text x="38" y="131" font-size="12" fill="#64748b">Пример: повторять, пока n &gt; 0</text>

    <rect x="182" y="145" width="126" height="38" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="245" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">n = 3</text>
    <path d="M245 183 V199" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <polygon points="245,205 326,251 245,297 164,251" fill="#fff7db" stroke="#a16207" stroke-width="1.8"/>
    <text x="245" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#713f12">n &gt; 0?</text>

    <path d="M245 297 V317" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="257" y="313" font-size="12" font-weight="600" fill="#166534">да</text>
    <rect x="158" y="326" width="174" height="63" rx="11" fill="#e6f7f0" stroke="#16835c" stroke-width="1.8"/>
    <text x="245" y="351" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">print(n)</text>
    <text x="245" y="372" text-anchor="middle" font-size="15" fill="#064e3b">n -= 1</text>
    <path d="M158 358 H96 V251 H158" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="42" y="305" font-size="11.5" fill="#475569">проверить</text>
    <text x="42" y="320" font-size="11.5" fill="#475569">снова</text>

    <path d="M326 251 H409 V410 H340" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="339" y="242" font-size="12" font-weight="600" fill="#9a3412">нет</text>
    <rect x="150" y="396" width="185" height="36" rx="10" fill="#eef2ff" stroke="#6370a9" stroke-width="1.6"/>
    <text x="242" y="419" text-anchor="middle" font-size="14" fill="#312e81">print("старт")</text>
    <text x="38" y="466" font-size="12" font-weight="600" fill="#334155">Вывод: 3 → 2 → 1 → старт</text>
    <text x="38" y="486" font-size="11.8" fill="#64748b">Для этого примера n уменьшается до 0.</text>

    <rect x="490" y="70" width="450" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="506" y="88" width="65" height="27" rx="8" fill="#dbeafe"/>
    <text x="538.5" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">FOR</text>
    <text x="586" y="106" font-size="14" fill="#334155">перебор значений</text>
    <text x="508" y="131" font-size="12" fill="#64748b">Пример: for i in range(1, 4)</text>

    <rect x="638" y="145" width="164" height="38" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="720" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">range(1, 4)</text>
    <path d="M720 183 V199" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <polygon points="720,205 809,251 720,297 631,251" fill="#fff7db" stroke="#a16207" stroke-width="1.8"/>
    <text x="720" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Есть следующий</text>
    <text x="720" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">элемент?</text>

    <path d="M720 297 V317" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="732" y="313" font-size="12" font-weight="600" fill="#166534">да</text>
    <rect x="632" y="326" width="176" height="63" rx="11" fill="#e6f7f0" stroke="#16835c" stroke-width="1.8"/>
    <text x="720" y="351" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">i = элемент</text>
    <text x="720" y="372" text-anchor="middle" font-size="14" fill="#064e3b">print(i)</text>
    <path d="M632 358 H562 V251 H625" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="510" y="305" font-size="11.5" fill="#475569">следующий</text>
    <text x="510" y="320" font-size="11.5" fill="#475569">элемент</text>

    <path d="M809 251 H875 V410 H805" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="826" y="242" font-size="12" font-weight="600" fill="#9a3412">нет</text>
    <rect x="636" y="396" width="164" height="36" rx="10" fill="#eef2ff" stroke="#6370a9" stroke-width="1.6"/>
    <text x="718" y="419" text-anchor="middle" font-size="14" fill="#312e81">цикл завершён</text>
    <text x="508" y="466" font-size="12" font-weight="600" fill="#334155">Вывод: 1 → 2 → 3</text>
    <text x="508" y="486" font-size="11.8" fill="#64748b">Правая граница 4 не включается.</text>
  </g>
  <text x="26" y="533" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">while проверяет условие заново; for запрашивает следующий элемент. Оба могут выполняться 0 раз.</text>
</svg>
