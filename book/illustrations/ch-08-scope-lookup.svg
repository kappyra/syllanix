<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" role="img"
     aria-labelledby="ttl8b desc8b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl8b">Порядок поиска имени по областям видимости: изнутри наружу</title>
  <desc id="desc8b">Четыре области видимости вложены одна в другую. Самая внутренняя — локальная область текущей функции, затем объемлющая область внешней функции, затем глобальная область файла, затем встроенная область с именами вроде print и int. Поиск имени начинается с локальной области и идёт наружу: первое найденное имя используется. Если имени нет ни в одной области, возникает ошибка NameError.</desc>

  <text x="30" y="30" font-size="16" font-weight="bold" fill="#1d3550">Где Python ищет имя: изнутри наружу</text>
  <text x="30" y="52" font-size="13" fill="#4a5a6a">номер показывает порядок проверки; первое найденное имя используется</text>

  <!-- глобальная -->
  <rect x="28" y="66" width="684" height="286" rx="12" fill="#f7fafd" stroke="#33557a" stroke-width="2"/>
  <circle cx="52" cy="88" r="13" fill="#e8f0fa" stroke="#33557a" stroke-width="2"/>
  <text x="52" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3550">3</text>
  <text x="74" y="94" font-size="14" font-weight="bold" fill="#1d3550">глобальная область</text>
  <text x="240" y="94" font-size="13" fill="#4a5a6a">имена верхнего уровня файла</text>

  <!-- объемлющая -->
  <rect x="66" y="108" width="608" height="228" rx="12" fill="#fdf8f0" stroke="#8a6a2f" stroke-width="2"/>
  <circle cx="90" cy="130" r="13" fill="#fdf1dc" stroke="#8a6a2f" stroke-width="2"/>
  <text x="90" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">2</text>
  <text x="112" y="136" font-size="14" font-weight="bold" fill="#4b3a16">объемлющая область</text>
  <text x="296" y="136" font-size="13" fill="#4b3a16">имена внешней функции</text>

  <!-- локальная -->
  <rect x="104" y="150" width="532" height="170" rx="12" fill="#eef7ee" stroke="#3f6b3f" stroke-width="2"/>
  <circle cx="128" cy="172" r="13" fill="#ffffff" stroke="#3f6b3f" stroke-width="2"/>
  <text x="128" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#264a26">1</text>
  <text x="150" y="178" font-size="14" font-weight="bold" fill="#264a26">локальная область текущей функции</text>

  <text x="150" y="214" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" fill="#264a26">value = "локальное"</text>
  <text x="150" y="238" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" fill="#264a26">print(value)</text>
  <text x="150" y="272" font-size="13" fill="#264a26">поиск начинается здесь: имя value найдено</text>
  <text x="150" y="294" font-size="13" fill="#264a26">и дальнейшие области не проверяются</text>

  <!-- встроенная -->
  <rect x="28" y="366" width="684" height="54" rx="12" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <circle cx="52" cy="393" r="13" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="52" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">4</text>
  <text x="74" y="398" font-size="14" font-weight="bold" fill="#222222">встроенная область</text>
  <text x="246" y="398" font-size="13" fill="#222222">print, input, int и другие имена, доступные, если не затенены</text>

  <text x="30" y="452" font-size="14" fill="#1d3550">Если имени нет ни в одной области, возникает ошибка NameError.</text>
  <text x="30" y="476" font-size="14" fill="#1d3550">Присваивание внутри функции создаёт имя в локальной области, а не во внешних.</text>
</svg>
