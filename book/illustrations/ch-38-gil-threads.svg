<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img"
     aria-labelledby="t38gl d38gl" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="t38gl">GIL: потоки по очереди исполняют байткод и освобождают блокировку при ожидании</title>
  <desc id="d38gl">В стандартной сборке CPython только один поток владеет GIL и исполняет байткод, остальные ждут. Потоки получают блокировку по очереди, поэтому вычисления в потоках не ускоряются. При ожидании ввода-вывода поток освобождает GIL, и другой поток продолжает работу — поэтому потоки полезны для сетевых и файловых операций. GIL защищает внутренние структуры интерпретатора, но не ваши данные: операция += состоит из нескольких байткодов, и переключение между ними создаёт состояние гонки.</desc>
  <defs>
    <marker id="arr38a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1d3550">GIL: один поток исполняет, остальные ждут</text>

  <text x="40" y="64" font-size="13.5" font-weight="bold" fill="#1d3550">Вычисления в потоках: блокировка переходит по очереди</text>
  <text x="40" y="100" font-size="12" fill="#33557a">поток 1</text>
  <text x="40" y="140" font-size="12" fill="#33557a">поток 2</text>
  <text x="40" y="180" font-size="12" fill="#33557a">поток 3</text>

  <rect x="120" y="84" width="150" height="26" rx="5" fill="#e8f5ec" stroke="#2f7a45" stroke-width="1.5"/>
  <text x="195" y="102" text-anchor="middle" font-size="11.5" fill="#1f5c33">исполняет</text>
  <rect x="270" y="84" width="450" height="26" rx="5" fill="#f1f1f1" stroke="#b9b4aa" stroke-width="1.5"/>
  <text x="495" y="102" text-anchor="middle" font-size="11.5" fill="#5a5a5a">ждёт GIL</text>

  <rect x="120" y="124" width="300" height="26" rx="5" fill="#f1f1f1" stroke="#b9b4aa" stroke-width="1.5"/>
  <text x="270" y="142" text-anchor="middle" font-size="11.5" fill="#5a5a5a">ждёт GIL</text>
  <rect x="420" y="124" width="150" height="26" rx="5" fill="#e8f5ec" stroke="#2f7a45" stroke-width="1.5"/>
  <text x="495" y="142" text-anchor="middle" font-size="11.5" fill="#1f5c33">исполняет</text>
  <rect x="570" y="124" width="150" height="26" rx="5" fill="#f1f1f1" stroke="#b9b4aa" stroke-width="1.5"/>
  <text x="645" y="142" text-anchor="middle" font-size="11.5" fill="#5a5a5a">ждёт GIL</text>

  <rect x="120" y="164" width="450" height="26" rx="5" fill="#f1f1f1" stroke="#b9b4aa" stroke-width="1.5"/>
  <text x="345" y="182" text-anchor="middle" font-size="11.5" fill="#5a5a5a">ждёт GIL</text>
  <rect x="570" y="164" width="150" height="26" rx="5" fill="#e8f5ec" stroke="#2f7a45" stroke-width="1.5"/>
  <text x="645" y="182" text-anchor="middle" font-size="11.5" fill="#1f5c33">исполняет</text>

  <text x="120" y="212" font-size="12" fill="#33557a">время →</text>
  <text x="720" y="212" text-anchor="end" font-size="12" fill="#33557a">в каждый момент байткод исполняет ровно один поток</text>

  <line x1="40" y1="236" x2="740" y2="236" stroke="#c9c2b4" stroke-width="1.2"/>

  <text x="40" y="266" font-size="13.5" font-weight="bold" fill="#1f5c33">Ожидание ввода-вывода: GIL освобождается</text>
  <rect x="120" y="284" width="240" height="30" rx="5" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="1.5"/>
  <text x="240" y="304" text-anchor="middle" font-size="11.5" fill="#4b3a16">поток 1 ждёт сеть</text>
  <rect x="360" y="284" width="360" height="30" rx="5" fill="#e8f5ec" stroke="#2f7a45" stroke-width="1.5"/>
  <text x="540" y="304" text-anchor="middle" font-size="11.5" fill="#1f5c33">поток 2 исполняет байткод — GIL свободен</text>

  <text x="40" y="346" font-size="12.5" fill="#33557a">Поэтому потоки ускоряют загрузку страниц и чтение файлов, но не вычисления</text>
  <text x="40" y="370" font-size="12.5" fill="#4b3a16">GIL не защищает ваши данные: counter += 1 — это чтение, сложение и запись,</text>
  <text x="40" y="392" font-size="12.5" fill="#4b3a16">между которыми другой поток может вклиниться и создать состояние гонки</text>

  <text x="390" y="426" text-anchor="middle" font-size="12.5" fill="#33557a">GIL — деталь CPython, а не гарантия языка; экспериментальные сборки без GIL уже существуют</text>
</svg>
