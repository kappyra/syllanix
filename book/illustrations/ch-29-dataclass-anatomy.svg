<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img"
     aria-labelledby="ttl29a desc29a" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl29a">Что порождает декоратор dataclass</title>
  <desc id="desc29a">Объявление класса Point с полями x и y под декоратором dataclass порождает методы __init__, __repr__ и __eq__, а при frozen=True ещё и __hash__. Порядок аннотаций задаёт порядок аргументов конструктора, изменяемые значения задают через default_factory.</desc>

  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr29a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="28" y="32" font-size="17" font-weight="bold" fill="#1d3550">Декоратор dataclass: объявление и сгенерированные методы</text>

  <!-- объявление -->
  <rect x="28" y="64" width="344" height="188" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="44" y="92" font-size="14" font-weight="bold" fill="#1d3550">объявление</text>
  <text x="44" y="126" font-size="13" fill="#33557a" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">@dataclass</text>
  <text x="44" y="152" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">class Point:</text>
  <text x="64" y="178" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">x: int</text>
  <text x="64" y="204" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">y: int</text>
  <text x="44" y="234" font-size="12" fill="#4b5563">только поля, без методов</text>

  <path d="M372 158 L 412 158" fill="none" stroke="#33557a" stroke-width="2.2" marker-end="url(#arr29a)"/>

  <!-- порождаемые методы -->
  <rect x="424" y="64" width="428" height="188" rx="10" fill="#f3faf5" stroke="#2f6b45" stroke-width="1.8"/>
  <text x="440" y="92" font-size="14" font-weight="bold" fill="#1d3550">порождает методы</text>
  <text x="440" y="128" font-size="13" fill="#1f5233" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">__init__(self, x, y)</text>
  <text x="440" y="158" font-size="13" fill="#1f5233" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">__repr__(self)</text>
  <text x="440" y="188" font-size="13" fill="#1f5233" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">__eq__(self, other)</text>
  <text x="440" y="222" font-size="12" fill="#2f6b45">и __hash__ при frozen=True</text>
  <text x="440" y="242" font-size="12" fill="#4b5563">и сравнения при order=True</text>

  <!-- пояснения -->
  <rect x="28" y="272" width="824" height="64" rx="8" fill="#f7f9fc" stroke="#c9d3e0" stroke-width="1.2"/>
  <text x="44" y="296" font-size="13" fill="#1d3550">Порядок аннотаций задаёт порядок аргументов конструктора.</text>
  <text x="44" y="320" font-size="13" fill="#33557a">Изменяемое значение задают через field(default_factory=...), а не напрямую.</text>
</svg>
