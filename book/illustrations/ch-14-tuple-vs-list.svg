<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
     aria-labelledby="ttl14a desc14a" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl14a">Сравнение списка и кортежа по доступным операциям</title>
  <desc id="desc14a">Таблица из пяти строк. Чтение: индексы, срезы, длина и проверка вхождения есть у обоих. Замена элемента, методы append, insert, pop, а также sort и del доступны только у списка; у кортежа их нет. Назначение списка — данные, которые меняются, назначение кортежа — фиксированный набор значений.</desc>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1d3550">Список и кортеж: что можно, а что нельзя</text>

  <!-- заголовок таблицы -->
  <rect x="30" y="56" width="250" height="44" fill="#1d3550"/>
  <text x="44" y="84" font-size="13" font-weight="bold" fill="#ffffff">свойство</text>
  <rect x="280" y="56" width="230" height="44" fill="#33557a"/>
  <text x="395" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">список [1, 2, 3]</text>
  <rect x="510" y="56" width="220" height="44" fill="#3c6b47"/>
  <text x="620" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">кортеж (1, 2, 3)</text>

  <!-- строки -->
  <rect x="30" y="100" width="250" height="52" fill="#f4f4f0" stroke="#d8d3c7" stroke-width="1"/>
  <text x="44" y="124" font-size="13" fill="#1d3550">чтение: индексы, срезы,</text>
  <text x="44" y="142" font-size="13" fill="#1d3550">длина, проверка вхождения</text>
  <rect x="280" y="100" width="230" height="52" fill="#eef4fb" stroke="#d8d3c7" stroke-width="1"/>
  <text x="395" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">есть</text>
  <rect x="510" y="100" width="220" height="52" fill="#eaf3ea" stroke="#d8d3c7" stroke-width="1"/>
  <text x="620" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">есть</text>

  <rect x="30" y="152" width="250" height="52" fill="#f4f4f0" stroke="#d8d3c7" stroke-width="1"/>
  <text x="44" y="184" font-size="13" fill="#1d3550">замена элемента</text>
  <rect x="280" y="152" width="230" height="52" fill="#eef4fb" stroke="#d8d3c7" stroke-width="1"/>
  <text x="395" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">есть</text>
  <rect x="510" y="152" width="220" height="52" fill="#fdf1f1" stroke="#d8d3c7" stroke-width="1"/>
  <text x="620" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">нет</text>

  <rect x="30" y="204" width="250" height="52" fill="#f4f4f0" stroke="#d8d3c7" stroke-width="1"/>
  <text x="44" y="236" font-size="13" fill="#1d3550">append, insert, pop</text>
  <rect x="280" y="204" width="230" height="52" fill="#eef4fb" stroke="#d8d3c7" stroke-width="1"/>
  <text x="395" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">есть</text>
  <rect x="510" y="204" width="220" height="52" fill="#fdf1f1" stroke="#d8d3c7" stroke-width="1"/>
  <text x="620" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">нет</text>

  <rect x="30" y="256" width="250" height="52" fill="#f4f4f0" stroke="#d8d3c7" stroke-width="1"/>
  <text x="44" y="288" font-size="13" fill="#1d3550">sort, del</text>
  <rect x="280" y="256" width="230" height="52" fill="#eef4fb" stroke="#d8d3c7" stroke-width="1"/>
  <text x="395" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">есть</text>
  <rect x="510" y="256" width="220" height="52" fill="#fdf1f1" stroke="#d8d3c7" stroke-width="1"/>
  <text x="620" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">нет</text>

  <rect x="30" y="308" width="250" height="52" fill="#f4f4f0" stroke="#d8d3c7" stroke-width="1"/>
  <text x="44" y="340" font-size="13" fill="#1d3550">назначение</text>
  <rect x="280" y="308" width="230" height="52" fill="#eef4fb" stroke="#d8d3c7" stroke-width="1"/>
  <text x="395" y="332" text-anchor="middle" font-size="12" fill="#1d3550">данные, которые</text>
  <text x="395" y="348" text-anchor="middle" font-size="12" fill="#1d3550">меняются</text>
  <rect x="510" y="308" width="220" height="52" fill="#eaf3ea" stroke="#d8d3c7" stroke-width="1"/>
  <text x="620" y="332" text-anchor="middle" font-size="12" fill="#254a2d">фиксированный</text>
  <text x="620" y="348" text-anchor="middle" font-size="12" fill="#254a2d">набор значений</text>

  <text x="30" y="386" font-size="13" fill="#4b3a16">Обе структуры остаются последовательностями: порядок и индексы сохраняются.</text>
</svg>
