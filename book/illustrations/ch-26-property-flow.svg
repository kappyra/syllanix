<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img"
     aria-labelledby="ttl26b desc26b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl26b">Присваивание свойству проходит через сеттер</title>
  <desc id="desc26b">Присваивание t.celsius вызывает сеттер celsius(value). Сеттер проверяет значение: если оно не ниже абсолютного нуля, записывает его во внутренний атрибут _celsius; если ниже, поднимает ValueError, и прежнее значение остаётся.</desc>

  <rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr26b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="28" y="32" font-size="17" font-weight="bold" fill="#1d3550">Присваивание свойству: где стоит проверка</text>

  <!-- присваивание -->
  <rect x="28" y="80" width="160" height="72" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="44" y="106" font-size="14" font-weight="bold" fill="#1d3550">присваивание</text>
  <text x="44" y="132" font-size="13" fill="#33557a" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">t.celsius = -300</text>

  <!-- сеттер -->
  <rect x="228" y="80" width="200" height="72" rx="8" fill="#fdf3e3" stroke="#8a5a13" stroke-width="1.8"/>
  <text x="244" y="106" font-size="14" font-weight="bold" fill="#1d3550">сеттер</text>
  <text x="244" y="132" font-size="13" fill="#8a5a13" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">celsius(value)</text>

  <!-- ромб проверки -->
  <polygon points="560,62 660,116 560,170 460,116" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <text x="560" y="110" text-anchor="middle" font-size="13" fill="#1d3550">value &gt;= -273.15 ?</text>
  <text x="560" y="130" text-anchor="middle" font-size="12" fill="#4b5563">проверка правила</text>

  <!-- запись -->
  <rect x="700" y="80" width="152" height="72" rx="8" fill="#e8f5ec" stroke="#2f6b45" stroke-width="1.8"/>
  <text x="716" y="106" font-size="14" font-weight="bold" fill="#1d3550">запись</text>
  <text x="716" y="132" font-size="12" fill="#2f6b45" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">_celsius = value</text>

  <!-- отказ -->
  <rect x="470" y="230" width="382" height="72" rx="8" fill="#fdf0ee" stroke="#a33a2a" stroke-width="1.8"/>
  <text x="486" y="256" font-size="14" font-weight="bold" fill="#8f2d1f">отказ: ValueError</text>
  <text x="486" y="280" font-size="13" fill="#8f2d1f">значение не записано, прежнее осталось</text>

  <!-- стрелки -->
  <path d="M188 116 L 220 116" fill="none" stroke="#33557a" stroke-width="2" marker-end="url(#arr26b)"/>
  <path d="M428 116 L 452 116" fill="none" stroke="#33557a" stroke-width="2" marker-end="url(#arr26b)"/>
  <path d="M660 116 L 692 116" fill="none" stroke="#33557a" stroke-width="2" marker-end="url(#arr26b)"/>
  <path d="M560 170 L 560 222" fill="none" stroke="#a33a2a" stroke-width="2" marker-end="url(#arr26b)"/>

  <text x="668" y="104" font-size="12" fill="#2f6b45">да</text>
  <text x="570" y="196" font-size="12" fill="#8f2d1f">нет</text>

  <text x="28" y="252" font-size="13" fill="#4b5563">Сеттер получает значение</text>
  <text x="28" y="274" font-size="13" fill="#4b5563">и решает, можно ли его</text>
  <text x="28" y="296" font-size="13" fill="#4b5563">записать во внутренний</text>
  <text x="28" y="318" font-size="13" fill="#4b5563">атрибут _celsius.</text>
</svg>
