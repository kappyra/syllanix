<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img"
     aria-labelledby="anatomy-title anatomy-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="anatomy-title">Анатомия графика: оси, подписи, легенда и источник</title>
  <desc id="anatomy-desc">Столбчатая диаграмма выручки по месяцам с пронумерованными элементами: заголовок, ось Y с единицами, ось X, деления и сетка, легенда, нулевая линия и подпись источника. Каждый элемент отвечает на вопрос, который иначе возникнет у читателя.</desc>

  <text x="415" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">Выручка по месяцам, первое полугодие 2026</text>
  <circle cx="640" cy="35" r="10" fill="#33557a"/>
  <text x="640" y="39" text-anchor="middle" font-size="11" fill="#ffffff">1</text>

  <!-- оси и сетка -->
  <line x1="170" y1="80" x2="170" y2="350" stroke="#1d3550" stroke-width="1.8"/>
  <line x1="170" y1="350" x2="660" y2="350" stroke="#1d3550" stroke-width="1.8"/>
  <line x1="170" y1="263" x2="660" y2="263" stroke="#e3e7ec" stroke-width="1"/>
  <line x1="170" y1="177" x2="660" y2="177" stroke="#e3e7ec" stroke-width="1"/>
  <line x1="170" y1="90" x2="660" y2="90" stroke="#e3e7ec" stroke-width="1"/>

  <!-- деления -->
  <text x="162" y="354" text-anchor="end" font-size="11" fill="#33557a">0</text>
  <text x="162" y="267" text-anchor="end" font-size="11" fill="#33557a">1 000</text>
  <text x="162" y="181" text-anchor="end" font-size="11" fill="#33557a">2 000</text>
  <text x="162" y="94" text-anchor="end" font-size="11" fill="#33557a">3 000</text>

  <!-- подпись оси Y -->
  <text x="118" y="215" font-size="12" fill="#1d3550" transform="rotate(-90 118 215)">Выручка, тыс. ₽</text>

  <!-- столбцы -->
  <rect x="190" y="246" width="48" height="104" fill="#33557a"/>
  <rect x="270" y="220" width="48" height="130" fill="#33557a"/>
  <rect x="350" y="272" width="48" height="78" fill="#33557a"/>
  <rect x="430" y="168" width="48" height="182" fill="#33557a"/>
  <rect x="510" y="194" width="48" height="156" fill="#33557a"/>
  <rect x="590" y="142" width="48" height="208" fill="#33557a"/>
  <polyline points="214,255 294,237 374,229 454,185 534,177 614,168" fill="none" stroke="#8a6a2f" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- легенда -->
  <rect x="466" y="88" width="176" height="48" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2"/>
  <rect x="482" y="99" width="28" height="10" fill="#33557a"/>
  <text x="518" y="108" font-size="11" fill="#1d3550">факт, столбцы</text>
  <line x1="482" y1="122" x2="510" y2="122" stroke="#8a6a2f" stroke-width="2.4" stroke-dasharray="5 3"/>
  <text x="518" y="126" font-size="11" fill="#1d3550">план</text>

  <!-- подписи категорий -->
  <text x="214" y="368" text-anchor="middle" font-size="11" fill="#33557a">янв</text>
  <text x="294" y="368" text-anchor="middle" font-size="11" fill="#33557a">фев</text>
  <text x="374" y="368" text-anchor="middle" font-size="11" fill="#33557a">мар</text>
  <text x="454" y="368" text-anchor="middle" font-size="11" fill="#33557a">апр</text>
  <text x="534" y="368" text-anchor="middle" font-size="11" fill="#33557a">май</text>
  <text x="614" y="368" text-anchor="middle" font-size="11" fill="#33557a">июн</text>

  <!-- подпись оси X -->
  <text x="415" y="390" text-anchor="middle" font-size="12" fill="#1d3550">Месяц</text>

  <!-- источник -->
  <text x="170" y="412" font-size="11" fill="#33557a">Источник: данные компании, первое полугодие 2026</text>

  <!-- номера элементов -->
  <circle cx="104" cy="290" r="10" fill="#33557a"/>
  <text x="104" y="294" text-anchor="middle" font-size="11" fill="#ffffff">2</text>
  <circle cx="480" cy="390" r="10" fill="#33557a"/>
  <text x="480" y="394" text-anchor="middle" font-size="11" fill="#ffffff">3</text>
  <circle cx="690" cy="177" r="10" fill="#33557a"/>
  <text x="690" y="181" text-anchor="middle" font-size="11" fill="#ffffff">4</text>
  <circle cx="690" cy="104" r="10" fill="#33557a"/>
  <text x="690" y="108" text-anchor="middle" font-size="11" fill="#ffffff">5</text>
  <circle cx="148" cy="330" r="10" fill="#33557a"/>
  <text x="148" y="334" text-anchor="middle" font-size="11" fill="#ffffff">6</text>
  <circle cx="620" cy="408" r="10" fill="#33557a"/>
  <text x="620" y="412" text-anchor="middle" font-size="11" fill="#ffffff">7</text>

  <!-- расшифровка -->
  <rect x="40" y="428" width="790" height="46" rx="8" fill="#f7f8fa" stroke="#9aa7b5" stroke-width="1.2"/>
  <text x="56" y="446" font-size="11" fill="#1d3550">1 — заголовок</text>
  <text x="242" y="446" font-size="11" fill="#1d3550">2 — ось Y: единицы</text>
  <text x="434" y="446" font-size="11" fill="#1d3550">3 — ось X: категории</text>
  <text x="626" y="446" font-size="11" fill="#1d3550">4 — деления и сетка</text>
  <text x="56" y="466" font-size="11" fill="#1d3550">5 — легенда: что за серия</text>
  <text x="242" y="466" font-size="11" fill="#1d3550">6 — нулевая линия</text>
  <text x="434" y="466" font-size="11" fill="#1d3550">7 — источник и период</text>
</svg>
