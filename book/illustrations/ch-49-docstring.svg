<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" role="img"
     aria-labelledby="ttl49b desc49b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl49b">Структура docstring в стиле Google: назначение, параметры, результат, исключения</title>
  <desc id="desc49b">Слева текст функции order_total с docstring в стиле Google, части отмечены номерами. Первая строка — краткое назначение в повелительном наклонении. Раздел Args перечисляет параметры и объясняет смысл каждого. Раздел Returns описывает возвращаемое значение. Раздел Raises перечисляет исключения, которые функция может поднять. Справа те же четыре части объяснены словами: именно их показывают help() и подсказки редактора, поэтому docstring читают как справку, а не как комментарий.</desc>

  <text x="30" y="30" font-size="16" font-weight="bold" fill="#1d3550">Docstring как справка: четыре части</text>
  <text x="30" y="52" font-size="13" fill="#4a5a6a">формат одинаков во всех функциях проекта, поэтому нужное находится на привычном месте</text>

  <!-- панель кода -->
  <rect x="24" y="70" width="446" height="352" rx="10" fill="#f7fafd" stroke="#33557a" stroke-width="2"/>
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#1d3550">
    <text x="56" y="102">def order_total(price, count,</text>
    <text x="56" y="122">                discount_percent=0):</text>
    <text x="68" y="146">"""Вернуть итог заказа.</text>
    <text x="68" y="178">Args:</text>
    <text x="80" y="198">price: цена в рублях.</text>
    <text x="80" y="218">count: количество единиц.</text>
    <text x="80" y="238">discount_percent: скидка, %.</text>
    <text x="68" y="270">Returns:</text>
    <text x="80" y="290">Итог в целых рублях.</text>
    <text x="68" y="322">Raises:</text>
    <text x="80" y="342">ValueError: если count</text>
    <text x="80" y="362">отрицательный.</text>
    <text x="68" y="386">"""</text>
    <text x="56" y="408">return total - discount</text>
  </g>

  <!-- маркеры в коде -->
  <circle cx="36" cy="142" r="9" fill="#33557a"/>
  <text x="36" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="36" cy="174" r="9" fill="#33557a"/>
  <text x="36" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="36" cy="266" r="9" fill="#33557a"/>
  <text x="36" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="36" cy="318" r="9" fill="#33557a"/>
  <text x="36" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">4</text>

  <!-- пояснения справа -->
  <rect x="492" y="96" width="232" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <circle cx="512" cy="120" r="11" fill="#33557a"/>
  <text x="512" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="532" y="118" font-size="13" font-weight="bold" fill="#1d3550">назначение</text>
  <text x="532" y="138" font-size="12.5" fill="#1d3550">одна строка,</text>
  <text x="532" y="154" font-size="12.5" fill="#1d3550">повелительное наклонение</text>

  <rect x="492" y="168" width="232" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <circle cx="512" cy="192" r="11" fill="#33557a"/>
  <text x="512" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="532" y="190" font-size="13" font-weight="bold" fill="#1d3550">параметры</text>
  <text x="532" y="210" font-size="12.5" fill="#1d3550">имя и смысл</text>
  <text x="532" y="226" font-size="12.5" fill="#1d3550">каждого параметра</text>

  <rect x="492" y="240" width="232" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <circle cx="512" cy="264" r="11" fill="#33557a"/>
  <text x="512" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="532" y="262" font-size="13" font-weight="bold" fill="#1d3550">результат</text>
  <text x="532" y="282" font-size="12.5" fill="#1d3550">что именно</text>
  <text x="532" y="298" font-size="12.5" fill="#1d3550">возвращается</text>

  <rect x="492" y="312" width="232" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="1.8"/>
  <circle cx="512" cy="336" r="11" fill="#33557a"/>
  <text x="512" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="532" y="334" font-size="13" font-weight="bold" fill="#1d3550">исключения</text>
  <text x="532" y="354" font-size="12.5" fill="#1d3550">когда и какая</text>
  <text x="532" y="370" font-size="12.5" fill="#1d3550">ошибка возможна</text>

  <text x="30" y="456" font-size="14" fill="#1d3550">Первая строка самостоятельна: редактор показывает её без остального текста.</text>
  <text x="30" y="482" font-size="14" font-weight="bold" fill="#1d3550">Однострочной функции с очевидным именем docstring не нужен.</text>
</svg>
