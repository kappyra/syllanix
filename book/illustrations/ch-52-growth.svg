<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img"
     aria-labelledby="growth-title growth-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="growth-title">Таблица роста числа операций для семи порядков сложности</title>
  <desc id="growth-desc">Для каждого порядка роста показано число операций при размере входа 10, 100 и 1000, типичный пример в Python и вывод о практической применимости. Константный, логарифмический, линейный и почти линейный порядки остаются рабочими, квадратичный замедляется, а экспоненциальный и факториальный становятся недостижимыми уже при n около ста.</desc>

  <text x="40" y="32" font-size="18" font-weight="bold" fill="#1d3550">Рост числа операций</text>
  <text x="40" y="56" font-size="13" fill="#33557a">Строки таблицы — порядки роста, столбцы — размер входа. Числа округлены.</text>

  <!-- шапка -->
  <line x1="40" y1="78" x2="830" y2="78" stroke="#9aa7b5" stroke-width="1.6"/>
  <text x="40" y="96" font-size="12" font-weight="bold" fill="#33557a">порядок</text>
  <text x="254" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">n = 10</text>
  <text x="382" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">n = 100</text>
  <text x="510" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">n = 1000</text>
  <text x="620" y="96" font-size="12" font-weight="bold" fill="#33557a">пример</text>
  <text x="752" y="96" font-size="12" font-weight="bold" fill="#33557a">вывод</text>

  <!-- O(1) -->
  <rect x="40" y="104" width="790" height="40" fill="#ffffff"/>
  <text x="40" y="130" font-size="14" font-weight="bold" fill="#2f4a20">O(1)</text>
  <text x="254" y="130" text-anchor="middle" font-size="13" fill="#1d3550">1</text>
  <text x="382" y="130" text-anchor="middle" font-size="13" fill="#1d3550">1</text>
  <text x="510" y="130" text-anchor="middle" font-size="13" fill="#1d3550">1</text>
  <text x="620" y="130" font-size="12" fill="#33557a">доступ по индексу</text>
  <text x="752" y="130" font-size="11" fill="#2f4a20">мгновенно</text>

  <!-- O(log n) -->
  <rect x="40" y="144" width="790" height="40" fill="#f7f8fa"/>
  <text x="40" y="170" font-size="14" font-weight="bold" fill="#2f4a20">O(log n)</text>
  <text x="254" y="170" text-anchor="middle" font-size="13" fill="#1d3550">4</text>
  <text x="382" y="170" text-anchor="middle" font-size="13" fill="#1d3550">7</text>
  <text x="510" y="170" text-anchor="middle" font-size="13" fill="#1d3550">10</text>
  <text x="620" y="170" font-size="12" fill="#33557a">двоичный поиск</text>
  <text x="752" y="170" font-size="11" fill="#2f4a20">мгновенно</text>

  <!-- O(n) -->
  <rect x="40" y="184" width="790" height="40" fill="#ffffff"/>
  <text x="40" y="210" font-size="14" font-weight="bold" fill="#2f4a20">O(n)</text>
  <text x="254" y="210" text-anchor="middle" font-size="13" fill="#1d3550">10</text>
  <text x="382" y="210" text-anchor="middle" font-size="13" fill="#1d3550">100</text>
  <text x="510" y="210" text-anchor="middle" font-size="13" fill="#1d3550">1 000</text>
  <text x="620" y="210" font-size="12" fill="#33557a">один проход</text>
  <text x="752" y="210" font-size="11" fill="#4b3a16">быстро</text>

  <!-- O(n log n) -->
  <rect x="40" y="224" width="790" height="40" fill="#f7f8fa"/>
  <text x="40" y="250" font-size="14" font-weight="bold" fill="#2f4a20">O(n log n)</text>
  <text x="254" y="250" text-anchor="middle" font-size="13" fill="#1d3550">33</text>
  <text x="382" y="250" text-anchor="middle" font-size="13" fill="#1d3550">664</text>
  <text x="510" y="250" text-anchor="middle" font-size="13" fill="#1d3550">9 966</text>
  <text x="620" y="250" font-size="12" fill="#33557a">сортировка</text>
  <text x="752" y="250" font-size="11" fill="#4b3a16">быстро</text>

  <!-- O(n^2) -->
  <rect x="40" y="264" width="790" height="40" fill="#fdf6ec"/>
  <text x="40" y="290" font-size="14" font-weight="bold" fill="#8a5a1f">O(n²)</text>
  <text x="254" y="290" text-anchor="middle" font-size="13" fill="#1d3550">100</text>
  <text x="382" y="290" text-anchor="middle" font-size="13" fill="#1d3550">10 000</text>
  <text x="510" y="290" text-anchor="middle" font-size="13" fill="#1d3550">1 000 000</text>
  <text x="620" y="290" font-size="12" fill="#33557a">вложенный цикл</text>
  <text x="752" y="290" font-size="11" fill="#8a5a1f">медленно</text>

  <!-- O(2^n) -->
  <rect x="40" y="304" width="790" height="40" fill="#fdf1f1"/>
  <text x="40" y="330" font-size="14" font-weight="bold" fill="#6b2020">O(2ⁿ)</text>
  <text x="254" y="330" text-anchor="middle" font-size="13" fill="#6b2020">1 024</text>
  <text x="382" y="330" text-anchor="middle" font-size="13" fill="#6b2020">≈ 10³⁰</text>
  <text x="510" y="330" text-anchor="middle" font-size="13" fill="#6b2020">≈ 10³⁰¹</text>
  <text x="620" y="330" font-size="12" fill="#33557a">все подмножества</text>
  <text x="752" y="330" font-size="11" fill="#6b2020">недостижимо</text>

  <!-- O(n!) -->
  <rect x="40" y="344" width="790" height="40" fill="#fdf1f1"/>
  <text x="40" y="370" font-size="14" font-weight="bold" fill="#6b2020">O(n!)</text>
  <text x="254" y="370" text-anchor="middle" font-size="13" fill="#6b2020">3 628 800</text>
  <text x="382" y="370" text-anchor="middle" font-size="13" fill="#6b2020">≈ 10¹⁵⁷</text>
  <text x="510" y="370" text-anchor="middle" font-size="13" fill="#6b2020">≈ 10²⁵⁶⁷</text>
  <text x="620" y="370" font-size="12" fill="#33557a">все перестановки</text>
  <text x="752" y="370" font-size="11" fill="#6b2020">недостижимо</text>

  <line x1="40" y1="384" x2="830" y2="384" stroke="#9aa7b5" stroke-width="1.6"/>

  <!-- пояснение -->
  <rect x="40" y="402" width="790" height="52" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.3"/>
  <text x="56" y="424" font-size="12" fill="#1d3550">При n = 1000 экспоненциальный и факториальный порядки требуют ~10³⁰¹ и ~10²⁵⁶⁷ операций:</text>
  <text x="56" y="444" font-size="12" fill="#1d3550">столько не выполнить ни на каком компьютере — константы здесь ничего не меняют.</text>
</svg>
