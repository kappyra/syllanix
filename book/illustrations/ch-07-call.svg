<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 580" role="img"
     aria-labelledby="ttl7a desc7a" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl7a">Вызов функции: аргументы становятся параметрами, return возвращает результат</title>
  <desc id="desc7a">Схема вызова area(3, 4). Аргументы 3 и 4 передаются в функцию, где сопоставляются параметрам width и height по порядку. Тело функции вычисляет произведение 3 и 4 и возвращает 12. Возвращаемое значение подставляется вместо вызова в выражение print, поэтому на экран выводится 12. Порядок аргументов важен: первый аргумент попадает первому параметру.</desc>

  <text x="30" y="30" font-size="16" font-weight="bold" fill="#1d3550">Что происходит при вызове функции</text>

  <rect x="250" y="46" width="240" height="44" rx="9" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="370" y="74" text-anchor="middle" font-size="15" fill="#1d3550">вызов: area(3, 4)</text>

  <line x1="370" y1="90" x2="370" y2="112" stroke="#33557a" stroke-width="2"/>
  <path d="M 363 107 L 370 119 L 377 107" fill="none" stroke="#33557a" stroke-width="2"/>
  <text x="382" y="110" font-size="13" fill="#4a5a6a">два аргумента</text>

  <!-- тело функции -->
  <rect x="110" y="128" width="520" height="196" rx="12" fill="#f7fafd" stroke="#33557a" stroke-width="2"/>
  <text x="130" y="156" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#1d3550">def area(width, height):</text>
  <text x="470" y="156" font-size="12.5" fill="#4a5a6a">это определение</text>

  <rect x="140" y="172" width="160" height="38" rx="8" fill="#fdf1dc" stroke="#8a6a2f" stroke-width="2"/>
  <text x="220" y="196" text-anchor="middle" font-size="14" fill="#4b3a16">width = 3</text>
  <rect x="320" y="172" width="160" height="38" rx="8" fill="#fdf1dc" stroke="#8a6a2f" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" font-size="14" fill="#4b3a16">height = 4</text>

  <text x="140" y="232" font-size="13" fill="#4b3a16">параметры получили значения по порядку:</text>
  <text x="140" y="250" font-size="13" fill="#4b3a16">первый аргумент — первому параметру</text>

  <rect x="140" y="260" width="460" height="46" rx="8" fill="#eef7ee" stroke="#3f6b3f" stroke-width="2"/>
  <text x="160" y="282" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" fill="#264a26">return width * height</text>
  <text x="160" y="299" font-size="13" fill="#264a26">3 * 4 = 12</text>
  <text x="470" y="282" font-size="13" fill="#264a26">тело исполняется</text>

  <line x1="370" y1="324" x2="370" y2="346" stroke="#3f6b3f" stroke-width="2"/>
  <path d="M 363 341 L 370 353 L 377 341" fill="none" stroke="#3f6b3f" stroke-width="2"/>
  <text x="382" y="344" font-size="13" fill="#264a26">return</text>

  <rect x="250" y="360" width="240" height="44" rx="9" fill="#eef7ee" stroke="#3f6b3f" stroke-width="2"/>
  <text x="370" y="388" text-anchor="middle" font-size="15" fill="#264a26">возвращаемое значение: 12</text>

  <line x1="370" y1="404" x2="370" y2="426" stroke="#33557a" stroke-width="2"/>
  <path d="M 363 421 L 370 433 L 377 421" fill="none" stroke="#33557a" stroke-width="2"/>
  <text x="382" y="424" font-size="13" fill="#4a5a6a">подставляется вместо вызова</text>

  <rect x="250" y="440" width="240" height="44" rx="9" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="370" y="468" text-anchor="middle" font-size="15" fill="#1d3550">print(12)</text>

  <line x1="370" y1="484" x2="370" y2="506" stroke="#555555" stroke-width="2"/>
  <path d="M 363 501 L 370 513 L 377 501" fill="none" stroke="#555555" stroke-width="2"/>

  <rect x="250" y="518" width="240" height="40" rx="9" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <text x="370" y="544" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#222222">12</text>
  <text x="504" y="544" font-size="13" fill="#4a5a6a">то, что видит человек</text>
</svg>
