<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 568" role="img"
     aria-labelledby="ttl7b desc7b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl7b">Чем return отличается от print: значение против текста в терминале</title>
  <desc id="desc7b">Две функции с одинаковым вычислением. Функция с return передаёт значение 12 обратно в точку вызова, поэтому это значение можно присвоить имени, сложить и напечатать. Функция с print отправляет текст 12 в терминал и возвращает None, поэтому в точке вызова получается None и в арифметике он не годится. Возврат адресован вызывающему коду, печать адресована человеку.</desc>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#1d3550">Одно вычисление — два разных исхода</text>
  <text x="30" y="54" font-size="13" fill="#4a5a6a">возврат отдаёт значение коду, печать показывает текст человеку</text>

  <!-- ===== левая панель: return ===== -->
  <rect x="24" y="70" width="332" height="404" rx="12" fill="#f7fafd" stroke="#3f6b3f" stroke-width="2"/>
  <text x="190" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#264a26">функция с return</text>

  <rect x="52" y="114" width="276" height="38" rx="8" fill="#eef7ee" stroke="#3f6b3f" stroke-width="2"/>
  <text x="190" y="138" text-anchor="middle" font-size="13" fill="#264a26">return width * height</text>
  <line x1="190" y1="152" x2="190" y2="174" stroke="#3f6b3f" stroke-width="2"/>
  <path d="M 183 169 L 190 181 L 197 169" fill="none" stroke="#3f6b3f" stroke-width="2"/>
  <text x="202" y="172" font-size="13" fill="#264a26">12</text>

  <rect x="52" y="188" width="276" height="38" rx="8" fill="#ffffff" stroke="#3f6b3f" stroke-width="2"/>
  <text x="190" y="212" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#264a26">result = area(3, 4)</text>
  <line x1="190" y1="226" x2="190" y2="248" stroke="#3f6b3f" stroke-width="2"/>
  <path d="M 183 243 L 190 255 L 197 243" fill="none" stroke="#3f6b3f" stroke-width="2"/>

  <rect x="52" y="262" width="276" height="38" rx="8" fill="#ffffff" stroke="#3f6b3f" stroke-width="2"/>
  <text x="190" y="286" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#264a26">result + 1</text>
  <text x="190" y="322" text-anchor="middle" font-size="14" fill="#264a26">13 — значение можно сложить</text>

  <line x1="52" y1="340" x2="328" y2="340" stroke="#c9c2b4" stroke-width="1.5"/>

  <rect x="52" y="356" width="276" height="38" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="190" y="380" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#1d3550">print(result)</text>
  <line x1="190" y1="394" x2="190" y2="412" stroke="#555555" stroke-width="2"/>
  <path d="M 183 407 L 190 419 L 197 407" fill="none" stroke="#555555" stroke-width="2"/>
  <rect x="120" y="424" width="140" height="32" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <text x="190" y="446" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" fill="#222222">12</text>

  <!-- ===== правая панель: print ===== -->
  <rect x="384" y="70" width="332" height="404" rx="12" fill="#f7fafd" stroke="#a33a3a" stroke-width="2"/>
  <text x="550" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a2222">функция с print</text>

  <rect x="412" y="114" width="276" height="38" rx="8" fill="#fff5f5" stroke="#a33a3a" stroke-width="2"/>
  <text x="550" y="138" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#7a2222">print(width * height)</text>
  <line x1="550" y1="152" x2="550" y2="174" stroke="#a33a3a" stroke-width="2"/>
  <path d="M 543 169 L 550 181 L 557 169" fill="none" stroke="#a33a3a" stroke-width="2"/>
  <text x="562" y="172" font-size="13" fill="#7a2222">None</text>

  <rect x="412" y="188" width="276" height="38" rx="8" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
  <text x="550" y="212" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#7a2222">result = show(3, 4)</text>
  <line x1="550" y1="226" x2="550" y2="248" stroke="#a33a3a" stroke-width="2"/>
  <path d="M 543 243 L 550 255 L 557 243" fill="none" stroke="#a33a3a" stroke-width="2"/>

  <rect x="412" y="262" width="276" height="38" rx="8" fill="#ffffff" stroke="#a33a3a" stroke-width="2"/>
  <text x="550" y="286" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#7a2222">result + 1</text>
  <text x="550" y="322" text-anchor="middle" font-size="14" fill="#7a2222">TypeError: к None прибавить нельзя</text>

  <line x1="412" y1="340" x2="688" y2="340" stroke="#c9c2b4" stroke-width="1.5"/>

  <rect x="412" y="356" width="276" height="38" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="550" y="380" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#1d3550">print(result)</text>
  <line x1="550" y1="394" x2="550" y2="412" stroke="#555555" stroke-width="2"/>
  <path d="M 543 407 L 550 419 L 557 407" fill="none" stroke="#555555" stroke-width="2"/>
  <rect x="480" y="424" width="140" height="32" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <text x="550" y="446" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" fill="#222222">None</text>

  <text x="30" y="506" font-size="14" font-weight="bold" fill="#1d3550">Функция должна возвращать результат, а печатать его будет</text>
  <text x="30" y="530" font-size="14" font-weight="bold" fill="#1d3550">тот код, который отвечает за вывод.</text>
</svg>
