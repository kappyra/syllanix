<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img"
     aria-labelledby="layers-title layers-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="layers-title">Слои приложения и направление зависимостей</title>
  <desc id="layers-desc">Сверху вниз идут слои: представление, приложение, домен и инфраструктура. Представление вызывает приложение, приложение вызывает домен, а инфраструктура реализует интерфейсы, объявленные для домена. Все зависимости направлены к домену: правила предметной области не знают о базе данных, сети и веб-фреймворке.</desc>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1d3550">Слои и направление зависимостей</text>
  <text x="40" y="58" font-size="13" fill="#33557a">Стрелка показывает, кто кого использует; зависимости направлены к домену.</text>

  <!-- представление -->
  <rect x="80" y="80" width="700" height="60" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="100" y="108" font-size="15" font-weight="bold" fill="#1d3550">представление</text>
  <text x="100" y="128" font-size="12" fill="#33557a">HTTP-обработчики, CLI, шаблоны — принимают запрос и показывают результат</text>

  <!-- приложение -->
  <rect x="80" y="170" width="700" height="60" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="1.8"/>
  <text x="100" y="198" font-size="15" font-weight="bold" fill="#4b3a16">приложение</text>
  <text x="100" y="218" font-size="12" fill="#4b3a16">сценарии: оформить заказ, пересчитать итог, отправить уведомление</text>

  <!-- домен -->
  <rect x="80" y="260" width="700" height="60" rx="8" fill="#f2f6ee" stroke="#4a6b35" stroke-width="2.2"/>
  <text x="100" y="288" font-size="15" font-weight="bold" fill="#2f4a20">домен</text>
  <text x="100" y="308" font-size="12" fill="#2f4a20">правила предметной области: суммы, скидки, инварианты — без базы и сети</text>

  <!-- инфраструктура -->
  <rect x="80" y="350" width="700" height="60" rx="8" fill="#fdf1f1" stroke="#8c2f2f" stroke-width="1.8"/>
  <text x="100" y="378" font-size="15" font-weight="bold" fill="#6b2020">инфраструктура</text>
  <text x="100" y="398" font-size="12" fill="#6b2020">SQLite, HTTP-клиенты, файлы, очереди — детали внешнего мира</text>

  <!-- стрелки -->
  <line x1="430" y1="140" x2="430" y2="164" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="430,168 423,158 437,158" fill="#33557a"/>
  <text x="448" y="159" font-size="12" fill="#33557a">вызывает</text>

  <line x1="430" y1="230" x2="430" y2="254" stroke="#8a6a2f" stroke-width="2.5"/>
  <polygon points="430,258 423,248 437,248" fill="#8a6a2f"/>
  <text x="448" y="249" font-size="12" fill="#8a6a2f">вызывает</text>

  <line x1="430" y1="350" x2="430" y2="326" stroke="#8c2f2f" stroke-width="2.5"/>
  <polygon points="430,322 423,332 437,332" fill="#8c2f2f"/>
  <text x="448" y="343" font-size="12" fill="#6b2020">реализует интерфейс, объявленный для домена</text>

  <!-- пояснение -->
  <rect x="80" y="430" width="700" height="36" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.3"/>
  <text x="98" y="453" font-size="12" fill="#1d3550">Проверка: домен не импортирует sqlite3, requests и фреймворк — иначе слои только называются слоями.</text>
</svg>
