<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-labelledby="ttl23c desc23c" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl23c">Списковое включение: фильтр, преобразование и новый список</title>
  <desc id="desc23c">Из исходного списка 1, 2, 3, 4, 5, 6 условие оставляет чётные числа, затем каждое возводится в квадрат, и получается новый список 4, 16, 36. Исходный список не меняется.</desc>

  <text x="32" y="34" font-size="17" font-weight="bold" fill="#1d3550">[n * n for n in numbers if n % 2 == 0]</text>

  <!-- исходный список -->
  <rect x="28" y="62" width="164" height="204" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="110" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3550">исходный список</text>
  <g font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">
    <text x="60" y="110">1</text>
    <text x="60" y="134">2</text>
    <text x="60" y="158">3</text>
    <text x="60" y="182">4</text>
    <text x="60" y="206">5</text>
    <text x="60" y="230">6</text>
  </g>
  <text x="110" y="254" text-anchor="middle" font-size="11" fill="#33557a">не меняется</text>

  <line x1="192" y1="160" x2="236" y2="160" stroke="#33557a" stroke-width="2"/>
  <polygon points="236,160 225,154 225,166" fill="#33557a"/>

  <!-- фильтр -->
  <rect x="240" y="104" width="150" height="112" rx="10" fill="#fdf3f1" stroke="#8a3030" stroke-width="2"/>
  <text x="315" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3030">условие</text>
  <text x="315" y="154" text-anchor="middle" font-size="13" fill="#8a3030" font-family="'DejaVu Sans Mono', monospace">n % 2 == 0</text>
  <text x="315" y="180" text-anchor="middle" font-size="11" fill="#8a3030">остаются 2, 4, 6</text>
  <text x="315" y="200" text-anchor="middle" font-size="11" fill="#8a3030">1, 3, 5 отброшены</text>

  <line x1="390" y1="160" x2="432" y2="160" stroke="#33557a" stroke-width="2"/>
  <polygon points="432,160 421,154 421,166" fill="#33557a"/>

  <!-- преобразование -->
  <rect x="436" y="104" width="160" height="112" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="516" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b3a16">преобразование</text>
  <text x="516" y="154" text-anchor="middle" font-size="14" fill="#4b3a16" font-family="'DejaVu Sans Mono', monospace">n * n</text>
  <text x="516" y="180" text-anchor="middle" font-size="11" fill="#6b5a34">2→4, 4→16, 6→36</text>

  <line x1="596" y1="160" x2="638" y2="160" stroke="#33557a" stroke-width="2"/>
  <polygon points="638,160 627,154 627,166" fill="#33557a"/>

  <!-- результат -->
  <rect x="642" y="86" width="92" height="148" rx="10" fill="#f1f8f2" stroke="#2f6b3f" stroke-width="2"/>
  <text x="688" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b3f">новый</text>
  <text x="688" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b3f">список</text>
  <text x="688" y="158" text-anchor="middle" font-size="13" fill="#2f6b3f" font-family="'DejaVu Sans Mono', monospace">4</text>
  <text x="688" y="182" text-anchor="middle" font-size="13" fill="#2f6b3f" font-family="'DejaVu Sans Mono', monospace">16</text>
  <text x="688" y="206" text-anchor="middle" font-size="13" fill="#2f6b3f" font-family="'DejaVu Sans Mono', monospace">36</text>

  <!-- порядок чтения -->
  <rect x="28" y="296" width="706" height="54" rx="9" fill="#ffffff" stroke="#5a6b7d" stroke-width="2"/>
  <text x="44" y="318" font-size="12" font-weight="bold" fill="#1d3550">порядок чтения: что положить → откуда взять → при каком условии</text>
  <text x="44" y="338" font-size="12" fill="#33557a">квадрат каждого n из numbers, если n чётное</text>

  <text x="32" y="382" font-size="12" fill="#5a6b7d">Включение строит новый список: исходный не меняется. Условие в конце отбрасывает элементы.</text>
  <text x="32" y="402" font-size="12" fill="#5a6b7d">Условное выражение (n if n &gt; 0 else 0) стоит перед for и заменяет значение, не уменьшая длину результата.</text>
  <text x="32" y="422" font-size="12" fill="#5a6b7d">Переменная включения имеет собственную область видимости и не перезаписывает внешние имена.</text>
</svg>
