<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img"
     aria-labelledby="ttl50b desc50b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl50b">Почему is зависит от реализации: кэш малых целых и интернирование строк</title>
  <desc id="desc50b">Три примера. Малые целые от минус пяти до 256 кэшируются: a = 256 и b = int("256") указывают на один объект, поэтому a is b истинно. Для 257 создаются два разных объекта, поэтому c is d ложно, хотя c == d истинно. Строковый литерал «python» интернируется, а строка, собранная во время выполнения через join, — нет, поэтому a is b ложно.</desc>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1d3550">Почему is зависит от реализации</text>

  <!-- ряд 1: малые целые -->
  <text x="30" y="66" font-size="13" font-weight="bold" fill="#4b3a16">малые целые: от −5 до 256 кэшируются</text>
  <rect x="30" y="78" width="180" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="44" y="104" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">a = 256</text>
  <rect x="30" y="130" width="180" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="44" y="156" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">b = int("256")</text>

  <line x1="216" y1="99" x2="300" y2="110" stroke="#33557a" stroke-width="2"/>
  <polygon points="306,112 296,106 300,117" fill="#33557a"/>
  <line x1="216" y1="151" x2="300" y2="126" stroke="#33557a" stroke-width="2"/>
  <polygon points="306,124 296,121 300,132" fill="#33557a"/>
  <rect x="310" y="88" width="180" height="60" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2.5"/>
  <text x="400" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b3a16">один объект 256</text>
  <text x="400" y="134" text-anchor="middle" font-size="12" fill="#4b3a16">из кэша CPython</text>

  <rect x="560" y="96" width="190" height="44" rx="8" fill="#eaf3ea" stroke="#3c6b47" stroke-width="2"/>
  <text x="655" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#254a2d">a is b → True</text>

  <line x1="30" y1="184" x2="750" y2="184" stroke="#d8d3c7" stroke-width="1"/>

  <!-- ряд 2: 257 -->
  <text x="30" y="212" font-size="13" font-weight="bold" fill="#8a2b2b">257 в кэш не входит: объекты разные</text>
  <rect x="30" y="224" width="180" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="44" y="250" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">c = 257</text>
  <rect x="30" y="276" width="180" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="44" y="302" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">d = int("257")</text>

  <line x1="216" y1="245" x2="290" y2="245" stroke="#33557a" stroke-width="2"/>
  <polygon points="296,245 286,240 286,250" fill="#33557a"/>
  <line x1="216" y1="297" x2="290" y2="297" stroke="#33557a" stroke-width="2"/>
  <polygon points="296,297 286,292 286,302" fill="#33557a"/>
  <rect x="306" y="222" width="140" height="46" rx="8" fill="#fdf1f1" stroke="#8a2b2b" stroke-width="2"/>
  <text x="376" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">объект 257</text>
  <rect x="306" y="274" width="140" height="46" rx="8" fill="#fdf1f1" stroke="#8a2b2b" stroke-width="2"/>
  <text x="376" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">объект 257</text>

  <rect x="560" y="248" width="190" height="44" rx="8" fill="#fdf1f1" stroke="#8a2b2b" stroke-width="2"/>
  <text x="655" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b2b">c is d → False</text>
  <text x="560" y="311" font-size="12" fill="#4b3a16">но c == d истинно:</text>
  <text x="560" y="327" font-size="12" fill="#4b3a16">значения равны</text>

  <line x1="30" y1="344" x2="750" y2="344" stroke="#d8d3c7" stroke-width="1"/>

  <!-- ряд 3: строки -->
  <text x="30" y="368" font-size="13" font-weight="bold" fill="#254a2d">строки: литерал интернируется, собранная во время выполнения — нет</text>
  <rect x="30" y="380" width="165" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="42" y="406" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">a = "python"</text>
  <line x1="201" y1="401" x2="211" y2="401" stroke="#33557a" stroke-width="2"/>
  <polygon points="217,401 207,396 207,406" fill="#33557a"/>
  <rect x="220" y="380" width="110" height="42" rx="8" fill="#eaf3ea" stroke="#3c6b47" stroke-width="2"/>
  <text x="275" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#254a2d">"python"</text>

  <rect x="345" y="380" width="250" height="42" rx="7" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="357" y="406" font-size="13" fill="#1d3550" font-family="'DejaVu Sans Mono', monospace">"".join(["py", "thon"])</text>
  <line x1="601" y1="401" x2="611" y2="401" stroke="#8a2b2b" stroke-width="2"/>
  <polygon points="617,401 607,396 607,406" fill="#8a2b2b"/>
  <rect x="620" y="380" width="110" height="42" rx="8" fill="#fdf1f1" stroke="#8a2b2b" stroke-width="2"/>
  <text x="675" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2b2b">"python"</text>

  <text x="30" y="448" font-size="13" fill="#8a2b2b">a is b → False, хотя a == b истинно: интернирование не гарантировано.</text>
  <text x="30" y="466" font-size="12" fill="#4b3a16">sys.intern(b) вернёт канонический объект, но в обычном коде достаточно ==.</text>
</svg>
