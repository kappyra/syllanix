<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-labelledby="ttl30b desc30b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl30b">Публичный интерфейс класса и его внутренняя часть</title>
  <desc id="desc30b">Публичный интерфейс класса OrderService: методы place и cancel, настройка notify только по имени и собственное исключение InsufficientFunds. Внутренняя часть — атрибут хранилища и метод проверки — не обещана вызывающему коду и может меняться без предупреждения.</desc>

  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="28" y="30" font-size="17" font-weight="bold" fill="#1d3550">Что класс показывает наружу</text>

  <!-- публичная часть -->
  <rect x="28" y="56" width="500" height="252" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="44" y="84" font-size="14" font-weight="bold" fill="#1d3550">публичный интерфейс</text>
  <line x1="44" y1="96" x2="512" y2="96" stroke="#9fb3c8" stroke-width="1.2"/>

  <text x="44" y="126" font-size="13" fill="#33557a" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">place(order, *, notify=True)</text>
  <text x="44" y="154" font-size="13" fill="#33557a" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">cancel(order_id)</text>

  <text x="44" y="188" font-size="12" fill="#1d3550">ошибки, о которых знает вызывающий код:</text>
  <text x="44" y="212" font-size="12" fill="#8f2d1f" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">InsufficientFunds</text>
  <text x="44" y="234" font-size="12" fill="#8f2d1f" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">ValueError</text>

  <text x="44" y="268" font-size="12" fill="#4b5563">настройки — только по имени, обязательные данные — по месту</text>
  <text x="44" y="290" font-size="12" fill="#4b5563">каждый публичный метод — обещание поддерживать его</text>

  <!-- внутренняя часть -->
  <rect x="556" y="56" width="296" height="252" rx="10" fill="#f7f9fc" stroke="#8a8f98" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="572" y="84" font-size="14" font-weight="bold" fill="#4b5563">внутреннее</text>
  <line x1="572" y1="96" x2="836" y2="96" stroke="#c9d3e0" stroke-width="1.2"/>

  <text x="572" y="128" font-size="13" fill="#4b5563" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">self._storage</text>
  <text x="572" y="158" font-size="13" fill="#4b5563" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">self._validate(order)</text>

  <text x="572" y="196" font-size="12" fill="#4b5563">не обещано вызывающему коду</text>
  <text x="572" y="218" font-size="12" fill="#4b5563">можно менять без предупреждения</text>
  <text x="572" y="240" font-size="12" fill="#4b5563">меняется при рефакторинге</text>

  <text x="572" y="276" font-size="12" fill="#4b5563">скрыто соглашением об имени</text>
  <text x="572" y="296" font-size="12" fill="#4b5563">и отсутствием в документации</text>

  <!-- итог -->
  <rect x="28" y="326" width="824" height="48" rx="8" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
  <text x="44" y="356" font-size="13" fill="#1d3550">Чем меньше публичная часть, тем свободнее менять внутреннюю.</text>
</svg>
