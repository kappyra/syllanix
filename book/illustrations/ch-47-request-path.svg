<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-labelledby="rp rpd" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="rp">Путь HTTP-запроса через API</title>
  <desc id="rpd">Клиент отправляет HTTP-запрос с методом, путём и телом JSON. Маршрутизатор выбирает обработчик, обработчик проверяет данные, сервис применяет правила предметной области и обращается к базе данных, затем формируется ответ с кодом состояния и телом JSON. Если проверка не прошла, ответ 400 формируется до обращения к сервису.</desc>

  <text x="26" y="32" font-size="17" font-weight="bold" fill="#1d3550">Путь запроса: от клиента до ответа</text>

  <rect x="24" y="64" width="132" height="98" rx="9" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="90" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">клиент</text>
  <text x="90" y="116" text-anchor="middle" font-size="11.5" fill="#33557a">POST /tasks</text>
  <text x="90" y="134" text-anchor="middle" font-size="11.5" fill="#33557a">{"title": "…"}</text>

  <line x1="158" y1="113" x2="190" y2="113" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="194,113 182,106 182,120" fill="#33557a"/>

  <rect x="198" y="64" width="120" height="98" rx="9" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="258" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">маршрут</text>
  <text x="258" y="118" text-anchor="middle" font-size="11.5" fill="#33557a">метод + путь</text>
  <text x="258" y="136" text-anchor="middle" font-size="11.5" fill="#33557a">→ обработчик</text>

  <line x1="320" y1="113" x2="352" y2="113" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="356,113 344,106 344,120" fill="#33557a"/>

  <rect x="360" y="64" width="124" height="98" rx="9" fill="#fffdf7" stroke="#8a6a2f" stroke-width="2"/>
  <text x="422" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b3a16">валидация</text>
  <text x="422" y="118" text-anchor="middle" font-size="11.5" fill="#4b3a16">поля и типы</text>
  <text x="422" y="136" text-anchor="middle" font-size="11.5" fill="#4b3a16">данных</text>

  <line x1="486" y1="113" x2="518" y2="113" stroke="#8a6a2f" stroke-width="2.5"/>
  <polygon points="522,113 510,106 510,120" fill="#8a6a2f"/>

  <rect x="526" y="64" width="128" height="98" rx="9" fill="#fffdf7" stroke="#8a6a2f" stroke-width="2"/>
  <text x="590" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b3a16">сервис</text>
  <text x="590" y="124" text-anchor="middle" font-size="12" fill="#4b3a16">бизнес-правила</text>

  <line x1="656" y1="113" x2="688" y2="113" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="692,113 680,106 680,120" fill="#33557a"/>

  <rect x="698" y="64" width="110" height="98" rx="9" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="753" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">база</text>
  <text x="753" y="124" text-anchor="middle" font-size="11.5" fill="#33557a">данных</text>

  <!-- response -->
  <line x1="590" y1="164" x2="590" y2="212" stroke="#2f6b3a" stroke-width="2.5"/>
  <polygon points="590,216 583,204 597,204" fill="#2f6b3a"/>
  <rect x="452" y="222" width="300" height="66" rx="9" fill="#eef7ef" stroke="#2f6b3a" stroke-width="2"/>
  <text x="602" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a28">ответ</text>
  <text x="602" y="270" text-anchor="middle" font-size="12" fill="#204a28">201 Created + JSON задачи</text>

  <!-- reject branch -->
  <line x1="422" y1="168" x2="422" y2="300" stroke="#8c2f2f" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="422,304 415,292 429,292" fill="#8c2f2f"/>
  <rect x="140" y="312" width="380" height="72" rx="9" fill="#fdf1f1" stroke="#8c2f2f" stroke-width="1.8"/>
  <text x="160" y="338" font-size="13" font-weight="bold" fill="#6b2020">Проверка не прошла → 400 Bad Request</text>
  <text x="160" y="360" font-size="12.5" fill="#6b2020">Сервис и база данных не вызываются.</text>
  <text x="160" y="378" font-size="11.5" fill="#8c2f2f">Ошибка клиента: запрос нужно исправить.</text>
</svg>
