name: Syllanix responsive browser checks

on:
  push:
    branches:
      - 'improve/**'
  pull_request:
    branches:
      - main
      - 'improve/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Chromium browser driver
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test responsive layouts and reader themes
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/syllanix-http.log 2>&1 &
          python scripts/check_ui.py
