name: Syllanix chapter 6 quality checks

on:
  push:
    branches:
      - main
      - 'improve/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-06:
    name: Chapter 6 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify executable examples, solutions, accessible SVG and HTML
        run: python scripts/verify_ch06.py
