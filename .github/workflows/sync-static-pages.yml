name: Synchronize static Syllanix pages in review branch

on:
  push:
    branches:
      - improve/full-book-quality-and-themes-20261102
    paths:
      - scripts/enrich_html_figures.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'kappyra/syllanix' && github.ref == 'refs/heads/improve/full-book-quality-and-themes-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Add verified descriptions and bust static asset caches
        run: python scripts/enrich_html_figures.py --write
      - name: Verify entire book and JavaScript
        run: |
          python scripts/audit_book.py
          node --check assets/site.js
          node --check assets/theme-boot.js
          git diff --check
      - name: Commit generated HTML only to the review branch
        run: |
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m 'site: publish verified figure descriptions and three-theme cache keys'
            git push origin HEAD:improve/full-book-quality-and-themes-20261102
          fi
