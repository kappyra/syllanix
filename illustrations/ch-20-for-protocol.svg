<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"
     aria-labelledby="ttl20f desc20f" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl20f">Что делает цикл for на каждом шаге</title>
  <desc id="desc20f">Схема: сначала for получает итератор вызовом iter от итерируемого объекта, затем многократно вызывает next. Если элемент получен, выполняется тело цикла и шаг повторяется. Когда next поднимает StopIteration, цикл завершается.</desc>

  <text x="32" y="34" font-size="17" font-weight="bold" fill="#1d3550">Цикл for: iter, затем next до StopIteration</text>

  <rect x="60" y="64" width="260" height="48" rx="9" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="190" y="94" text-anchor="middle" font-size="13" fill="#1d3550">items — итерируемый объект</text>

  <line x1="190" y1="112" x2="190" y2="132" stroke="#33557a" stroke-width="2"/>
  <polygon points="190,132 184,121 196,121" fill="#33557a"/>

  <rect x="60" y="136" width="260" height="48" rx="9" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="190" y="166" text-anchor="middle" font-size="13" fill="#1d3550">it = iter(items)</text>

  <line x1="190" y1="184" x2="190" y2="206" stroke="#33557a" stroke-width="2"/>
  <polygon points="190,206 184,195 196,195" fill="#33557a"/>

  <rect x="60" y="210" width="260" height="56" rx="9" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="190" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3550">value = next(it)</text>
  <text x="190" y="254" text-anchor="middle" font-size="11" fill="#33557a">запросить следующий элемент</text>

  <!-- ветвь «элемент есть» -->
  <line x1="320" y1="238" x2="408" y2="238" stroke="#2f6b3f" stroke-width="2"/>
  <polygon points="408,238 397,232 397,244" fill="#2f6b3f"/>
  <text x="364" y="228" text-anchor="middle" font-size="11" fill="#2f6b3f">элемент есть</text>

  <rect x="412" y="210" width="270" height="56" rx="9" fill="#f1f8f2" stroke="#2f6b3f" stroke-width="2"/>
  <text x="547" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b3f">тело цикла</text>
  <text x="547" y="254" text-anchor="middle" font-size="11" fill="#2f6b3f">работаем с value</text>

  <!-- возврат к next -->
  <path d="M 682 238 L 722 238 L 722 300 L 310 300 L 310 266" fill="none" stroke="#2f6b3f" stroke-width="2"/>
  <polygon points="310,266 304,277 316,277" fill="#2f6b3f"/>
  <text x="516" y="322" text-anchor="middle" font-size="11" fill="#2f6b3f">повторяем, пока элементы не закончатся</text>

  <!-- ветвь StopIteration -->
  <line x1="190" y1="266" x2="190" y2="340" stroke="#8a3030" stroke-width="2"/>
  <polygon points="190,340 184,329 196,329" fill="#8a3030"/>
  <text x="212" y="312" font-size="11" fill="#8a3030">StopIteration</text>

  <rect x="60" y="344" width="260" height="56" rx="9" fill="#fdf3f1" stroke="#8a3030" stroke-width="2"/>
  <text x="190" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3030">выход из цикла</text>
  <text x="190" y="388" text-anchor="middle" font-size="11" fill="#8a3030">исключение ловит сам for</text>

  <text x="32" y="430" font-size="12" fill="#5a6b7d">Ручной вызов next без try/except приводит к ошибке: StopIteration никто не ловит.</text>
  <text x="32" y="448" font-size="12" fill="#5a6b7d">Именно поэтому перебирать нужно итерируемый объект целым циклом, а не «по кусочкам».</text>
</svg>
