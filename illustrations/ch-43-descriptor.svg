<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img"
     aria-labelledby="descriptor-title descriptor-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="descriptor-title">Как работает дескриптор: класс, экземпляр и протокол</title>
  <desc id="descriptor-desc">Дескриптор объявлен в классе: при создании класса Python вызывает __set_name__ и сообщает дескриптору имя атрибута. При чтении атрибута у экземпляра вызывается __get__, при записи — __set__, который проверяет значение и хранит его в отдельном поле словаря экземпляра.</desc>

  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1d3550">Протокол дескрипторов</text>
  <text x="30" y="56" font-size="13" fill="#33557a">Дескриптор живёт в классе, а данные хранит в экземпляре.</text>

  <!-- класс -->
  <rect x="60" y="90" width="300" height="132" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="1.8"/>
  <text x="78" y="118" font-size="14" font-weight="bold" fill="#1d3550">класс Order</text>
  <rect x="78" y="132" width="264" height="34" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.4"/>
  <text x="92" y="154" font-size="13" fill="#1d3550">quantity = Positive()</text>
  <text x="78" y="190" font-size="12" fill="#33557a">объявление атрибута</text>
  <text x="78" y="208" font-size="12" fill="#33557a">в теле класса</text>

  <!-- дескриптор -->
  <rect x="470" y="80" width="350" height="190" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="1.8"/>
  <text x="488" y="108" font-size="14" font-weight="bold" fill="#4b3a16">дескриптор Positive</text>
  <text x="488" y="136" font-size="13" fill="#4b3a16">__set_name__(owner, "quantity")</text>
  <text x="488" y="156" font-size="12" fill="#8a6a2f">запоминает имя при создании класса</text>
  <text x="488" y="182" font-size="13" fill="#4b3a16">__get__(instance, owner)</text>
  <text x="488" y="202" font-size="12" fill="#8a6a2f">читает значение из экземпляра</text>
  <text x="488" y="228" font-size="13" fill="#4b3a16">__set__(instance, value)</text>
  <text x="488" y="248" font-size="12" fill="#8a6a2f">проверяет и записывает</text>

  <!-- экземпляр -->
  <rect x="60" y="296" width="300" height="104" rx="10" fill="#f2f6ee" stroke="#4a6b35" stroke-width="1.8"/>
  <text x="78" y="324" font-size="14" font-weight="bold" fill="#2f4a20">экземпляр Order</text>
  <text x="78" y="350" font-size="13" fill="#2f4a20">__dict__ = {"_quantity": 3}</text>
  <text x="78" y="374" font-size="12" fill="#2f4a20">здесь лежит само значение</text>

  <!-- стрелка: set_name -->
  <line x1="362" y1="140" x2="464" y2="140" stroke="#8a6a2f" stroke-width="2.2"/>
  <polygon points="468,140 458,134 458,146" fill="#8a6a2f"/>
  <text x="414" y="130" text-anchor="middle" font-size="12" fill="#8a6a2f">__set_name__</text>

  <!-- стрелка: get/set -->
  <polyline points="362,332 700,332 700,276" fill="none" stroke="#33557a" stroke-width="2.2"/>
  <polygon points="700,272 693,282 707,282" fill="#33557a"/>
  <text x="530" y="322" text-anchor="middle" font-size="12" fill="#33557a">__get__ и __set__ при доступе</text>

  <!-- стрелка: хранение -->
  <polyline points="470,240 210,240 210,290" fill="none" stroke="#4a6b35" stroke-width="2.2"/>
  <polygon points="210,294 203,284 217,284" fill="#4a6b35"/>
  <text x="340" y="262" text-anchor="middle" font-size="12" fill="#2f4a20">значение пишется в _quantity</text>

  <!-- пояснение -->
  <rect x="470" y="392" width="350" height="64" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.3"/>
  <text x="486" y="414" font-size="12" fill="#1d3550">Без дескриптора класс хранил бы значение</text>
  <text x="486" y="432" font-size="12" fill="#1d3550">как обычный атрибут экземпляра.</text>
  <text x="486" y="450" font-size="12" fill="#33557a">Дескриптор добавляет проверку на входе.</text>
</svg>
