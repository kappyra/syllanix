<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img"
     aria-labelledby="event-loop-title event-loop-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="event-loop-title">Цикл событий: очередь задач, исполнение и ожидание</title>
  <desc id="event-loop-desc">Цикл событий берёт задачу из очереди готовых, исполняет её до ближайшего await, переводит в ожидание и опрашивает события. Когда событие наступило, задача снова попадает в очередь готовых. Всё это происходит в одном потоке, поэтому в каждый момент выполняется только одна задача.</desc>

  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1d3550">Цикл событий в одном потоке</text>
  <text x="30" y="58" font-size="13" fill="#33557a">Порядок шагов повторяется, пока есть работа.</text>

  <!-- очередь готовых -->
  <rect x="40" y="90" width="250" height="110" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="165" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">очередь готовых задач</text>
  <rect x="66" y="132" width="58" height="36" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.5"/>
  <text x="95" y="156" text-anchor="middle" font-size="14" fill="#1d3550">A</text>
  <rect x="136" y="132" width="58" height="36" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.5"/>
  <text x="165" y="156" text-anchor="middle" font-size="14" fill="#1d3550">B</text>
  <rect x="206" y="132" width="58" height="36" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="1.5"/>
  <text x="235" y="156" text-anchor="middle" font-size="14" fill="#1d3550">C</text>

  <!-- задача выполняется -->
  <rect x="570" y="90" width="250" height="110" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="695" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b3a16">задача выполняется</text>
  <text x="695" y="143" text-anchor="middle" font-size="13" fill="#4b3a16">до ближайшего await</text>
  <text x="695" y="166" text-anchor="middle" font-size="13" fill="#4b3a16">и держит исполнитель</text>

  <!-- ждёт событий -->
  <rect x="570" y="290" width="250" height="110" rx="10" fill="#fdf1f1" stroke="#8c2f2f" stroke-width="2"/>
  <text x="695" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b2020">ждёт события</text>
  <text x="695" y="343" text-anchor="middle" font-size="13" fill="#6b2020">таймер, сокет,</text>
  <text x="695" y="366" text-anchor="middle" font-size="13" fill="#6b2020">ответ базы данных</text>

  <!-- проверка событий -->
  <rect x="40" y="290" width="250" height="110" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="165" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">проверка событий</text>
  <text x="165" y="343" text-anchor="middle" font-size="13" fill="#1d3550">что уже готово?</text>
  <text x="165" y="366" text-anchor="middle" font-size="13" fill="#1d3550">перевод в очередь</text>

  <!-- цикл в центре -->
  <circle cx="430" cy="245" r="58" fill="#ffffff" stroke="#33557a" stroke-width="2.5"/>
  <text x="430" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">цикл</text>
  <text x="430" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">событий</text>

  <!-- запуск: очередь -> выполняется -->
  <line x1="292" y1="145" x2="562" y2="145" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="566,145 554,138 554,152" fill="#33557a"/>
  <text x="429" y="132" text-anchor="middle" font-size="13" fill="#33557a">запуск</text>

  <!-- await: выполняется -> ждёт -->
  <line x1="695" y1="202" x2="695" y2="282" stroke="#8c2f2f" stroke-width="2.5"/>
  <polygon points="695,286 688,274 702,274" fill="#8c2f2f"/>
  <text x="708" y="248" font-size="13" fill="#6b2020">await</text>

  <!-- опрос: ждёт -> проверка -->
  <line x1="568" y1="345" x2="298" y2="345" stroke="#8c2f2f" stroke-width="2.5"/>
  <polygon points="294,345 306,338 306,352" fill="#8c2f2f"/>
  <text x="431" y="378" text-anchor="middle" font-size="13" fill="#6b2020">опрос событий</text>

  <!-- снова готово: проверка -> очередь -->
  <line x1="165" y1="288" x2="165" y2="208" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="165,204 158,216 172,216" fill="#33557a"/>
  <text x="178" y="248" font-size="13" fill="#33557a">снова</text>
  <text x="178" y="266" font-size="13" fill="#33557a">готова</text>

  <!-- пояснение -->
  <rect x="40" y="424" width="780" height="52" rx="10" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.5"/>
  <text x="58" y="446" font-size="13" fill="#1d3550">Задача не отдаёт управление, пока не встретит await; цикл не может её прервать.</text>
  <text x="58" y="466" font-size="13" fill="#1d3550">Поэтому асинхронность ускоряет ожидание, но не вычисления.</text>
</svg>
