<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img"
     aria-labelledby="cl cld" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="cl">Слои консольного приложения</title>
  <desc id="cld">Командная строка разбирает аргументы и вызывает слой сервиса. Сервис содержит правила предметной области и обращается к хранилищу. Хранилище читает и записывает JSON-файл. Тесты проверяют сервис и хранилище отдельно от командной строки.</desc>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1d3550">Слои приложения и направление зависимостей</text>

  <!-- CLI -->
  <rect x="60" y="62" width="300" height="76" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="210" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3550">CLI: разбор аргументов</text>
  <text x="210" y="114" text-anchor="middle" font-size="12.5" fill="#33557a">argparse: команды add / list / done</text>
  <text x="210" y="131" text-anchor="middle" font-size="11.5" fill="#33557a">знает только про ввод и вывод</text>

  <line x1="210" y1="138" x2="210" y2="172" stroke="#33557a" stroke-width="2.5"/>
  <polygon points="210,176 203,164 217,164" fill="#33557a"/>
  <line x1="240" y1="176" x2="240" y2="142" stroke="#8a6a2f" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="240,138 233,150 247,150" fill="#8a6a2f"/>
  <text x="256" y="162" font-size="11.5" fill="#5a6b7d">результат</text>

  <!-- service -->
  <rect x="60" y="180" width="300" height="86" rx="10" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="210" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b3a16">Сервис: правила</text>
  <text x="210" y="232" text-anchor="middle" font-size="12.5" fill="#4b3a16">добавить, закрыть, найти; валидация</text>
  <text x="210" y="251" text-anchor="middle" font-size="11.5" fill="#4b3a16">не знает про argparse и про файлы</text>

  <line x1="210" y1="266" x2="210" y2="300" stroke="#8a6a2f" stroke-width="2.5"/>
  <polygon points="210,304 203,292 217,292" fill="#8a6a2f"/>

  <!-- repository -->
  <rect x="60" y="308" width="300" height="76" rx="10" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="210" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b3a16">Хранилище</text>
  <text x="210" y="360" text-anchor="middle" font-size="12.5" fill="#4b3a16">загрузить / сохранить список задач</text>
  <text x="210" y="377" text-anchor="middle" font-size="11.5" fill="#4b3a16">атомарная запись, кодировка UTF-8</text>

  <line x1="210" y1="384" x2="210" y2="412" stroke="#2f6b3a" stroke-width="2.5"/>
  <polygon points="210,416 203,404 217,404" fill="#2f6b3a"/>
  <rect x="96" y="420" width="228" height="40" rx="8" fill="#eef7ef" stroke="#2f6b3a" stroke-width="2"/>
  <text x="210" y="446" text-anchor="middle" font-size="13" fill="#204a28">tasks.json</text>

  <!-- tests -->
  <rect x="440" y="120" width="360" height="180" rx="10" fill="#fdf7ea" stroke="#8a6a2f" stroke-width="1.8"/>
  <text x="460" y="148" font-size="14" font-weight="bold" fill="#4b3a16">Тесты</text>
  <text x="460" y="174" font-size="12.5" fill="#4b3a16">• сервис — без файлов и CLI;</text>
  <text x="460" y="196" font-size="12.5" fill="#4b3a16">• хранилище — на временном файле;</text>
  <text x="460" y="218" font-size="12.5" fill="#4b3a16">• CLI — один тест «сквозь».</text>
  <text x="460" y="248" font-size="12.5" fill="#4b3a16">Каждый слой можно заменить,</text>
  <text x="460" y="268" font-size="12.5" fill="#4b3a16">не переписывая остальные.</text>

  <line x1="440" y1="236" x2="372" y2="236" stroke="#8a6a2f" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="366,236 378,229 378,243" fill="#8a6a2f"/>

  <text x="440" y="340" font-size="12.5" fill="#5a6b7d">Зависимости направлены вниз:</text>
  <text x="440" y="360" font-size="12.5" fill="#5a6b7d">CLI → Сервис → Хранилище.</text>
  <text x="440" y="380" font-size="12.5" fill="#5a6b7d">Обратных зависимостей нет —</text>
  <text x="440" y="400" font-size="12.5" fill="#5a6b7d">поэтому слои можно тестировать</text>
  <text x="440" y="420" font-size="12.5" fill="#5a6b7d">и заменять по отдельности.</text>
</svg>
