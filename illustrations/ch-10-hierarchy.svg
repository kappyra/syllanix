<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img"
     aria-labelledby="ttl10b desc10b" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl10b">Иерархия исключений: от BaseException до конкретных типов</title>
  <desc id="desc10b">Дерево классов исключений. В корне BaseException. Его потомки: Exception, SystemExit и KeyboardInterrupt. От Exception ответвляются ArithmeticError, ValueError, TypeError и LookupError. От ArithmeticError ответвляется ZeroDivisionError, от LookupError — IndexError и KeyError. Перехват базового класса перехватывает всех потомков, а SystemExit и KeyboardInterrupt в Exception не входят.</desc>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1d3550">Иерархия исключений</text>

  <!-- корень -->
  <rect x="300" y="52" width="180" height="44" rx="8" fill="#1d3550" stroke="#1d3550" stroke-width="2"/>
  <text x="390" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">BaseException</text>

  <!-- линии от корня -->
  <line x1="390" y1="96" x2="390" y2="116" stroke="#33557a" stroke-width="2"/>
  <line x1="175" y1="116" x2="620" y2="116" stroke="#33557a" stroke-width="2"/>
  <line x1="175" y1="116" x2="175" y2="140" stroke="#33557a" stroke-width="2"/>
  <line x1="390" y1="116" x2="390" y2="140" stroke="#33557a" stroke-width="2"/>
  <line x1="620" y1="116" x2="620" y2="140" stroke="#33557a" stroke-width="2"/>

  <!-- второй уровень -->
  <rect x="95" y="140" width="160" height="44" rx="8" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="175" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">Exception</text>
  <rect x="315" y="140" width="150" height="44" rx="8" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="168" text-anchor="middle" font-size="14" fill="#3a3a3a">SystemExit</text>
  <rect x="520" y="140" width="200" height="44" rx="8" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="620" y="168" text-anchor="middle" font-size="14" fill="#3a3a3a">KeyboardInterrupt</text>

  <!-- потомки Exception -->
  <line x1="175" y1="184" x2="175" y2="206" stroke="#33557a" stroke-width="2"/>
  <line x1="105" y1="206" x2="620" y2="206" stroke="#33557a" stroke-width="2"/>
  <line x1="105" y1="206" x2="105" y2="230" stroke="#33557a" stroke-width="2"/>
  <line x1="290" y1="206" x2="290" y2="230" stroke="#33557a" stroke-width="2"/>
  <line x1="455" y1="206" x2="455" y2="230" stroke="#33557a" stroke-width="2"/>
  <line x1="620" y1="206" x2="620" y2="230" stroke="#33557a" stroke-width="2"/>

  <rect x="30" y="230" width="150" height="44" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="105" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">ArithmeticError</text>
  <rect x="225" y="230" width="130" height="44" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="290" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">ValueError</text>
  <rect x="390" y="230" width="130" height="44" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="455" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">TypeError</text>
  <rect x="545" y="230" width="150" height="44" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="620" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">LookupError</text>

  <!-- потомки ArithmeticError -->
  <line x1="105" y1="274" x2="105" y2="296" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="105" y1="296" x2="260" y2="296" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="105" y1="296" x2="105" y2="320" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="260" y1="296" x2="260" y2="320" stroke="#8a6a2f" stroke-width="2"/>
  <rect x="25" y="320" width="160" height="44" rx="8" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="105" y="348" text-anchor="middle" font-size="13" fill="#4b3a16">ZeroDivisionError</text>
  <rect x="200" y="320" width="120" height="44" rx="8" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#4b3a16">OverflowError</text>

  <!-- потомки LookupError -->
  <line x1="620" y1="274" x2="620" y2="296" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="540" y1="296" x2="700" y2="296" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="540" y1="296" x2="540" y2="320" stroke="#8a6a2f" stroke-width="2"/>
  <line x1="700" y1="296" x2="700" y2="320" stroke="#8a6a2f" stroke-width="2"/>
  <rect x="465" y="320" width="150" height="44" rx="8" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="540" y="348" text-anchor="middle" font-size="13" fill="#4b3a16">IndexError</text>
  <rect x="630" y="320" width="140" height="44" rx="8" fill="#ffffff" stroke="#8a6a2f" stroke-width="2"/>
  <text x="700" y="348" text-anchor="middle" font-size="13" fill="#4b3a16">KeyError</text>

  <line x1="30" y1="380" x2="750" y2="380" stroke="#c9c2b4" stroke-width="1.5"/>
  <text x="30" y="402" font-size="13" fill="#4b3a16">Перехват родителя ловит всех потомков: except ArithmeticError</text>
  <text x="30" y="420" font-size="13" fill="#4b3a16">поймает и ZeroDivisionError. Пунктирные классы не входят в Exception.</text>
</svg>
