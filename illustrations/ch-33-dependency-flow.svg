<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img"
     aria-labelledby="t33dp d33dp" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="t33dp">Путь зависимости: манифест, разрешение версий, файл блокировки и окружение</title>
  <desc id="d33dp">Манифест pyproject.toml задаёт требования к зависимостям. Разрешение версий учитывает индекс пакетов и выбирает совместимые версии. Результат записывается в файл блокировки uv.lock с точными версиями и хешами. Из файла блокировки собирается виртуальное окружение .venv, одинаковое у всех разработчиков и на сервере сборки.</desc>
  <defs>
    <marker id="arr33b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1d3550">Путь зависимости: от требования до установленного пакета</text>

  <rect x="180" y="52" width="420" height="58" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="390" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">pyproject.toml</text>
  <text x="390" y="96" text-anchor="middle" font-size="12.5" fill="#33557a">требования: httpx&gt;=0.27, rich&gt;=13.7</text>

  <rect x="180" y="140" width="420" height="58" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="390" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">Разрешение версий</text>
  <text x="390" y="184" text-anchor="middle" font-size="12.5" fill="#33557a">подбирает совместимый набор и транзитивные зависимости</text>

  <rect x="20" y="140" width="130" height="58" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="85" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b3a16">Индекс пакетов</text>
  <text x="85" y="184" text-anchor="middle" font-size="12" fill="#4b3a16">PyPI</text>

  <rect x="180" y="228" width="420" height="58" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="390" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">uv.lock — файл блокировки</text>
  <text x="390" y="272" text-anchor="middle" font-size="12.5" fill="#33557a">точные версии всех зависимостей и хеши пакетов</text>

  <rect x="180" y="316" width="420" height="58" rx="10" fill="#e8f5ec" stroke="#2f7a45" stroke-width="2"/>
  <text x="390" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5c33">.venv — виртуальное окружение</text>
  <text x="390" y="360" text-anchor="middle" font-size="12.5" fill="#1f5c33">одинаковый набор пакетов у всех и на сервере сборки</text>

  <line x1="390" y1="110" x2="390" y2="136" stroke="#33557a" stroke-width="2" marker-end="url(#arr33b)"/>
  <line x1="390" y1="198" x2="390" y2="224" stroke="#33557a" stroke-width="2" marker-end="url(#arr33b)"/>
  <line x1="390" y1="286" x2="390" y2="312" stroke="#33557a" stroke-width="2" marker-end="url(#arr33b)"/>
  <line x1="150" y1="169" x2="176" y2="169" stroke="#8a6a2f" stroke-width="2" marker-end="url(#arr33b)"/>

  <text x="624" y="168" font-size="12" fill="#33557a">версии и метаданные</text>
  <text x="624" y="256" font-size="12" fill="#33557a">фиксируется один раз</text>
  <text x="624" y="276" font-size="12" fill="#33557a">и коммитится в git</text>

  <text x="390" y="410" text-anchor="middle" font-size="12.5" fill="#33557a">Манифест говорит «что нужно», блокировка — «что именно установлено»</text>
</svg>
