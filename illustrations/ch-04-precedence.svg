<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" role="img"
     aria-labelledby="ttl4a desc4a" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="ttl4a">Дерево вычисления выражения: порядок операторов и роль скобок</title>
  <desc id="desc4a">Слева выражение 2 + 3 * 4 разобрано в дерево: умножение стоит ниже сложения и вычисляется первым, поэтому 3 * 4 равно 12, а затем 2 + 12 равно 14. Справа выражение (2 + 3) * 4: скобки поднимают сложение, поэтому сначала 2 + 3 равно 5, затем 5 * 4 равно 20. Кружком обозначена операция, прямоугольником — значение.</desc>

  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1d3550">Как читает выражение интерпретатор</text>
  <text x="30" y="56" font-size="13" fill="#4a5a6a">кружок — операция, прямоугольник — значение; вычисление идёт от нижних узлов к верхнему</text>

  <!-- ===== левая панель ===== -->
  <rect x="24" y="72" width="336" height="276" rx="12" fill="#f7fafd" stroke="#33557a" stroke-width="2"/>
  <text x="192" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d3550">2 + 3 * 4</text>

  <line x1="192" y1="142" x2="140" y2="186" stroke="#33557a" stroke-width="2"/>
  <line x1="192" y1="142" x2="252" y2="186" stroke="#33557a" stroke-width="2"/>
  <line x1="252" y1="222" x2="228" y2="252" stroke="#33557a" stroke-width="2"/>
  <line x1="252" y1="222" x2="288" y2="252" stroke="#33557a" stroke-width="2"/>

  <circle cx="192" cy="130" r="20" fill="#e8f0fa" stroke="#33557a" stroke-width="2"/>
  <text x="192" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3550">+</text>

  <rect x="120" y="186" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="140" y="208" text-anchor="middle" font-size="16" fill="#1d3550">2</text>

  <circle cx="252" cy="204" r="20" fill="#fdf1dc" stroke="#8a6a2f" stroke-width="2"/>
  <text x="252" y="211" text-anchor="middle" font-size="18" font-weight="bold" fill="#4b3a16">*</text>

  <rect x="208" y="252" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="228" y="274" text-anchor="middle" font-size="16" fill="#1d3550">3</text>

  <rect x="268" y="252" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="288" y="274" text-anchor="middle" font-size="16" fill="#1d3550">4</text>

  <line x1="40" y1="300" x2="344" y2="300" stroke="#c9c2b4" stroke-width="1.5"/>
  <text x="40" y="322" font-size="14" fill="#1d3550">Сначала: 3 * 4 = 12</text>
  <text x="40" y="340" font-size="14" font-weight="bold" fill="#1d3550">Затем: 2 + 12 = 14</text>

  <!-- ===== правая панель ===== -->
  <rect x="380" y="72" width="336" height="276" rx="12" fill="#f7fafd" stroke="#33557a" stroke-width="2"/>
  <text x="548" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d3550">(2 + 3) * 4</text>

  <line x1="548" y1="142" x2="496" y2="186" stroke="#33557a" stroke-width="2"/>
  <line x1="548" y1="142" x2="608" y2="186" stroke="#33557a" stroke-width="2"/>
  <line x1="496" y1="222" x2="472" y2="252" stroke="#33557a" stroke-width="2"/>
  <line x1="496" y1="222" x2="532" y2="252" stroke="#33557a" stroke-width="2"/>

  <circle cx="548" cy="130" r="20" fill="#fdf1dc" stroke="#8a6a2f" stroke-width="2"/>
  <text x="548" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#4b3a16">*</text>

  <circle cx="496" cy="204" r="20" fill="#e8f0fa" stroke="#33557a" stroke-width="2"/>
  <text x="496" y="211" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3550">+</text>

  <rect x="576" y="186" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="596" y="208" text-anchor="middle" font-size="16" fill="#1d3550">4</text>

  <rect x="452" y="252" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="472" y="274" text-anchor="middle" font-size="16" fill="#1d3550">2</text>

  <rect x="512" y="252" width="40" height="30" rx="6" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="532" y="274" text-anchor="middle" font-size="16" fill="#1d3550">3</text>

  <line x1="396" y1="300" x2="700" y2="300" stroke="#c9c2b4" stroke-width="1.5"/>
  <text x="396" y="322" font-size="14" fill="#1d3550">Сначала: 2 + 3 = 5</text>
  <text x="396" y="340" font-size="14" font-weight="bold" fill="#1d3550">Затем: 5 * 4 = 20</text>

  <text x="30" y="380" font-size="14" fill="#1d3550">Одно и то же выражение с разными скобками даёт разные значения:</text>
  <text x="30" y="404" font-size="15" font-weight="bold" fill="#1d3550">2 + 3 * 4 = 14, а (2 + 3) * 4 = 20</text>
</svg>
