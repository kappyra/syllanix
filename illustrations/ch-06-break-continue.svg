<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">break и continue — два различных перехода в Python</title>
  <desc id="description">Две независимые схемы. Если условие для break истинно, выполняется break и завершается ближайший цикл: ветвь else цикла пропускается, а выполнение продолжается после цикла. Если условие для continue истинно, остаток тела пропускается и начинается следующий шаг: for запрашивает следующий элемент, while снова проверяет условие. Если условие ложно, оставшаяся часть тела выполняется обычно.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52647d"/></marker></defs>
  <rect width="960" height="540" rx="20" fill="#f1f5f9"/>
  <g font-family="system-ui, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <text x="26" y="35" font-size="22" font-weight="700" fill="#0f172a">break ≠ continue</text>
    <text x="26" y="55" font-size="12.5" fill="#475569">Действуют внутри ближайшего цикла, но ведут к разным точкам выполнения.</text>

    <rect x="20" y="75" width="450" height="423" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="36" y="93" width="91" height="30" rx="9" fill="#fee2e2"/>
    <text x="81.5" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">break</text>
    <text x="144" y="112" font-size="13.5" fill="#334155">выйти из ближайшего цикла</text>
    <rect x="102" y="143" width="286" height="51" rx="11" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="245" y="164" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a">for n in range(4):</text>
    <text x="245" y="183" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a">if n == 2: break</text>
    <path d="M245 194 V214" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <polygon points="245,219 329,266 245,313 161,266" fill="#fff7db" stroke="#a16207" stroke-width="1.8"/>
    <text x="245" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#713f12">Условие</text>
    <text x="245" y="280" text-anchor="middle" font-size="13.5" font-weight="600" fill="#713f12">истинно?</text>

    <path d="M245 313 V333 H169 V346" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="209" y="329" font-size="12" font-weight="700" fill="#991b1b">да</text>
    <rect x="60" y="353" width="218" height="63" rx="11" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
    <text x="169" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#881337">Цикл завершён</text>
    <text x="169" y="396" text-anchor="middle" font-size="12.5" fill="#881337">else цикла пропущен</text>
    <path d="M329 266 H385 V346" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="344" y="256" font-size="12" font-weight="700" fill="#475569">нет</text>
    <rect x="300" y="353" width="143" height="63" rx="11" fill="#e6f7f0" stroke="#16835c" stroke-width="1.8"/>
    <text x="371" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">Остаток тела</text>
    <text x="371" y="394" text-anchor="middle" font-size="12.5" fill="#064e3b">выполняется</text>
    <text x="40" y="454" font-size="12.5" font-weight="700" fill="#334155">Далее при break:</text>
    <text x="40" y="475" font-size="12" fill="#475569">первая инструкция после ближайшего цикла.</text>

    <rect x="490" y="75" width="450" height="423" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="506" y="93" width="121" height="30" rx="9" fill="#dcfce7"/>
    <text x="566.5" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">continue</text>
    <text x="645" y="112" font-size="13.5" fill="#334155">пропустить остаток тела</text>
    <rect x="572" y="143" width="286" height="51" rx="11" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="715" y="164" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a">for n in range(4):</text>
    <text x="715" y="183" text-anchor="middle" font-family="monospace" font-size="14" fill="#0f172a">if n == 2: continue</text>
    <path d="M715 194 V214" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <polygon points="715,219 799,266 715,313 631,266" fill="#fff7db" stroke="#a16207" stroke-width="1.8"/>
    <text x="715" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#713f12">Условие</text>
    <text x="715" y="280" text-anchor="middle" font-size="13.5" font-weight="600" fill="#713f12">истинно?</text>
    <path d="M715 313 V333 H639 V346" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="679" y="329" font-size="12" font-weight="700" fill="#166534">да</text>
    <rect x="530" y="353" width="218" height="63" rx="11" fill="#e6f7f0" stroke="#16835c" stroke-width="1.8"/>
    <text x="639" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Следующий шаг цикла</text>
    <text x="639" y="396" text-anchor="middle" font-size="12.5" fill="#064e3b">остаток тела пропущен</text>
    <path d="M799 266 H855 V346" stroke="#52647d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="814" y="256" font-size="12" font-weight="700" fill="#475569">нет</text>
    <rect x="770" y="353" width="143" height="63" rx="11" fill="#eef2ff" stroke="#6370a9" stroke-width="1.8"/>
    <text x="841" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">Остаток тела</text>
    <text x="841" y="394" text-anchor="middle" font-size="12.5" fill="#312e81">выполняется</text>
    <text x="508" y="454" font-size="12.5" font-weight="700" fill="#334155">Далее при continue:</text>
    <text x="508" y="475" font-size="12" fill="#475569">for — следующий элемент; while — проверка условия.</text>
  </g>
  <text x="26" y="526" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">Важно: при вложенности break завершает только ближайший цикл, а не все внешние циклы.</text>
</svg>
