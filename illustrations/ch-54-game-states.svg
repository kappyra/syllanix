<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img"
     aria-labelledby="t54gs d54gs" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="t54gs">Состояния игры «угадай число» и переходы между ними</title>
  <desc id="d54gs">Игровой цикл начинается в состоянии ожидания догадки. Если догадка меньше секрета, игра переходит в состояние «мало», если больше — в состояние «много»; из обоих состояний новая догадка возвращает игру в ожидание. Совпадение ведёт в состояние «победа», а исчерпание попыток — в состояние «поражение». Состояние и условия переходов образуют конечный автомат, а игровой цикл повторяет ввод, обновление состояния и отрисовку.</desc>
  <defs>
    <marker id="arr54a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
    <marker id="arr54r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6a2f"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1d3550">Состояния игры: конечный автомат в действии</text>

  <rect x="270" y="56" width="240" height="64" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="390" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">Ожидание догадки</text>
  <text x="390" y="104" text-anchor="middle" font-size="12.5" fill="#33557a">ввод → обновление → вывод</text>

  <rect x="60" y="190" width="180" height="70" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="150" y="218" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d3550">Мало</text>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#33557a">guess &lt; secret</text>

  <rect x="540" y="190" width="180" height="70" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="630" y="218" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d3550">Много</text>
  <text x="630" y="240" text-anchor="middle" font-size="12" fill="#33557a">guess &gt; secret</text>

  <line x1="330" y1="120" x2="196" y2="186" stroke="#33557a" stroke-width="2" marker-end="url(#arr54a)"/>
  
  <line x1="450" y1="120" x2="584" y2="186" stroke="#33557a" stroke-width="2" marker-end="url(#arr54a)"/>
  

  <path d="M 150 186 C 150 150, 240 132, 266 116" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#arr54r)"/>
  
  <path d="M 630 186 C 630 150, 540 132, 514 116" fill="none" stroke="#8a6a2f" stroke-width="2" marker-end="url(#arr54r)"/>
  

  <line x1="390" y1="120" x2="390" y2="292" stroke="#33557a" stroke-width="2"/>
  <line x1="200" y1="292" x2="600" y2="292" stroke="#33557a" stroke-width="2"/>
  <line x1="200" y1="292" x2="200" y2="336" stroke="#33557a" stroke-width="2" marker-end="url(#arr54a)"/>
  <line x1="600" y1="292" x2="600" y2="336" stroke="#33557a" stroke-width="2" marker-end="url(#arr54a)"/>
  <text x="212" y="318" font-size="11.5" fill="#33557a">guess == secret</text>
  <text x="612" y="318" font-size="11.5" fill="#33557a">попытки кончились</text>

  <rect x="110" y="340" width="180" height="66" rx="10" fill="#e8f5ec" stroke="#2f7a45" stroke-width="2"/>
  <text x="200" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1f5c33">Победа</text>
  <text x="200" y="388" text-anchor="middle" font-size="12" fill="#1f5c33">цикл завершён</text>

  <rect x="510" y="340" width="180" height="66" rx="10" fill="#fdecea" stroke="#a33a2c" stroke-width="2"/>
  <text x="600" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a2b20">Поражение</text>
  <text x="600" y="388" text-anchor="middle" font-size="12" fill="#7a2b20">цикл завершён</text>

  <text x="390" y="436" text-anchor="middle" font-size="12.5" fill="#33557a">Состояние + условия переходов + счётчик попыток = конечный автомат</text>
  <text x="390" y="458" text-anchor="middle" font-size="12" fill="#4b3a16">Из «Мало» и «Много» новая догадка возвращает цикл в ожидание</text>
</svg>
