<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img"
     aria-labelledby="structures-title structures-desc"
     font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="structures-title">Сложность операций у list, dict, set и deque</title>
  <desc id="structures-desc">Таблица операций: поиск по значению, доступ по индексу, вставка в конец, вставка в середину и удаление из начала. У списка доступ по индексу за O(1), но поиск, вставка в середину и удаление из начала за O(n). У словаря и множества операции в среднем за O(1). У deque вставка и удаление с обоих концов за O(1). Звёздочкой отмечена амортизированная стоимость, крестиком — оценка в среднем при хорошем хешировании.</desc>

  <text x="40" y="32" font-size="18" font-weight="bold" fill="#1d3550">Сложность операций</text>
  <text x="40" y="56" font-size="13" fill="#33557a">* — амортизированная стоимость, † — в среднем, при хорошем хешировании.</text>

  <!-- шапка -->
  <line x1="40" y1="76" x2="830" y2="76" stroke="#9aa7b5" stroke-width="1.6"/>
  <text x="40" y="94" font-size="12" font-weight="bold" fill="#33557a">структура</text>
  <text x="254" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">поиск значения</text>
  <text x="382" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">доступ по индексу</text>
  <text x="510" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">в конец</text>
  <text x="638" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">в середину</text>
  <text x="766" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33557a">из начала</text>

  <!-- list -->
  <rect x="40" y="104" width="790" height="56" fill="#ffffff"/>
  <text x="40" y="128" font-size="15" font-weight="bold" fill="#1d3550">list</text>
  <text x="40" y="148" font-size="12" fill="#33557a">массив ссылок</text>
  <text x="254" y="136" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>
  <text x="382" y="136" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)</text>
  <text x="510" y="136" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)*</text>
  <text x="638" y="136" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>
  <text x="766" y="136" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>

  <!-- dict -->
  <rect x="40" y="160" width="790" height="56" fill="#f7f8fa"/>
  <text x="40" y="184" font-size="15" font-weight="bold" fill="#1d3550">dict</text>
  <text x="40" y="204" font-size="12" fill="#33557a">ключ → значение</text>
  <text x="254" y="192" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>
  <text x="382" y="192" text-anchor="middle" font-size="13" fill="#9aa7b5">—</text>
  <text x="510" y="192" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>
  <text x="638" y="192" text-anchor="middle" font-size="13" fill="#9aa7b5">—</text>
  <text x="766" y="192" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>

  <!-- set -->
  <rect x="40" y="216" width="790" height="56" fill="#ffffff"/>
  <text x="40" y="240" font-size="15" font-weight="bold" fill="#1d3550">set</text>
  <text x="40" y="260" font-size="12" fill="#33557a">только ключи</text>
  <text x="254" y="248" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>
  <text x="382" y="248" text-anchor="middle" font-size="13" fill="#9aa7b5">—</text>
  <text x="510" y="248" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>
  <text x="638" y="248" text-anchor="middle" font-size="13" fill="#9aa7b5">—</text>
  <text x="766" y="248" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)†</text>

  <!-- deque -->
  <rect x="40" y="272" width="790" height="56" fill="#f7f8fa"/>
  <text x="40" y="296" font-size="15" font-weight="bold" fill="#1d3550">deque</text>
  <text x="40" y="316" font-size="12" fill="#33557a">двусторонняя очередь</text>
  <text x="254" y="304" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>
  <text x="382" y="304" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>
  <text x="510" y="304" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)</text>
  <text x="638" y="304" text-anchor="middle" font-size="14" fill="#8a5a1f">O(n)</text>
  <text x="766" y="304" text-anchor="middle" font-size="14" fill="#2f4a20">O(1)</text>

  <line x1="40" y1="336" x2="830" y2="336" stroke="#9aa7b5" stroke-width="1.6"/>

  <!-- пояснения -->
  <rect x="40" y="352" width="790" height="72" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.3"/>
  <text x="56" y="374" font-size="12" fill="#1d3550">* — амортизированная: редкие дорогие расширения размазаны по многим операциям.</text>
  <text x="56" y="394" font-size="12" fill="#1d3550">† — в среднем: при плохом хешировании поиск в словаре и множестве деградирует до O(n).</text>
  <text x="56" y="414" font-size="12" fill="#8a5a1f">Главное различие: удалить первый элемент у списка стоит O(n), у deque — O(1).</text>
</svg>
