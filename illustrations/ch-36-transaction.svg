<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img"
     aria-labelledby="t36tr d36tr" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="t36tr">Транзакция: успешный commit и откат rollback при сбое</title>
  <desc id="d36tr">Верхний сценарий: из счёта Ани списывается 30, на счёт Бориса зачисляется 30, затем выполняется commit, и видны оба изменения — 70 и 80. Нижний сценарий: между списанием и зачислением происходит сбой, выполняется rollback, и наблюдатель видит исходные 100 и 50. Промежуточное состояние наружу не показывается.</desc>
  <defs>
    <marker id="arr36a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1d3550">Транзакция: всё или ничего</text>

  <text x="40" y="62" font-size="13" font-weight="bold" fill="#1f5c33">Успешный сценарий</text>
  <rect x="40" y="74" width="160" height="62" rx="8" fill="#e8f5ec" stroke="#2f7a45" stroke-width="2"/>
  <text x="56" y="98" font-size="12.5" fill="#1f5c33">Было</text>
  <text x="56" y="118" font-size="12.5" fill="#1f5c33">Аня 100, Борис 50</text>
  <rect x="230" y="74" width="150" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="246" y="98" font-size="12.5" fill="#1d3550">Списать 30</text>
  <text x="246" y="118" font-size="12.5" fill="#1d3550">у Ани</text>
  <rect x="410" y="74" width="150" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="426" y="98" font-size="12.5" fill="#1d3550">Зачислить 30</text>
  <text x="426" y="118" font-size="12.5" fill="#1d3550">Борису</text>
  <rect x="590" y="74" width="150" height="62" rx="8" fill="#e8f5ec" stroke="#2f7a45" stroke-width="2"/>
  <text x="606" y="98" font-size="13" font-weight="bold" fill="#1f5c33">COMMIT</text>
  <text x="606" y="118" font-size="12" fill="#1f5c33">оба изменения</text>
  <line x1="200" y1="105" x2="226" y2="105" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <line x1="380" y1="105" x2="406" y2="105" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <line x1="560" y1="105" x2="586" y2="105" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <text x="40" y="164" font-size="12.5" fill="#1f5c33">Наблюдатель видит: Аня 70, Борис 80</text>

  <line x1="40" y1="184" x2="740" y2="184" stroke="#c9c2b4" stroke-width="1.2"/>

  <text x="40" y="212" font-size="13" font-weight="bold" fill="#7a2b20">Сбой между шагами</text>
  <rect x="40" y="224" width="160" height="62" rx="8" fill="#fdecea" stroke="#a33a2c" stroke-width="2"/>
  <text x="56" y="248" font-size="12.5" fill="#7a2b20">Было</text>
  <text x="56" y="268" font-size="12.5" fill="#7a2b20">Аня 100, Борис 50</text>
  <rect x="230" y="224" width="150" height="62" rx="8" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="246" y="248" font-size="12.5" fill="#1d3550">Списать 30</text>
  <text x="246" y="268" font-size="12.5" fill="#1d3550">у Ани</text>
  <rect x="410" y="224" width="150" height="62" rx="8" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2"/>
  <text x="426" y="248" font-size="13" font-weight="bold" fill="#4b3a16">СБОЙ</text>
  <text x="426" y="268" font-size="12" fill="#4b3a16">шаг не выполнен</text>
  <rect x="590" y="224" width="150" height="62" rx="8" fill="#fdecea" stroke="#a33a2c" stroke-width="2"/>
  <text x="606" y="248" font-size="13" font-weight="bold" fill="#7a2b20">ROLLBACK</text>
  <text x="606" y="268" font-size="12" fill="#7a2b20">всё отменено</text>
  <line x1="200" y1="255" x2="226" y2="255" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <line x1="380" y1="255" x2="406" y2="255" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <line x1="560" y1="255" x2="586" y2="255" stroke="#33557a" stroke-width="2" marker-end="url(#arr36a)"/>
  <text x="40" y="314" font-size="12.5" fill="#7a2b20">Наблюдатель видит: Аня 100, Борис 50 — как до транзакции</text>

  <text x="390" y="356" text-anchor="middle" font-size="12.5" fill="#33557a">Промежуточное состояние наружу не показывается: либо до всех изменений, либо после всех</text>
  <text x="390" y="382" text-anchor="middle" font-size="12.5" fill="#33557a">Именно поэтому перевод денег оформляют одной транзакцией</text>
</svg>
