<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img"
     aria-labelledby="t31sr d31sr" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="t31sr">Один код и две проверки: mypy до запуска и интерпретатор во время выполнения</title>
  <desc id="d31sr">Исходный код с аннотациями читают два независимых контура. Слева mypy разбирает код, не исполняя его, и сообщает о несовместимых типах до запуска. Справа интерпретатор исполняет код и не проверяет аннотации, поэтому ошибка типа проявляется только на конкретных данных. Вывод: статическая проверка и тесты дополняют друг друга.</desc>
  <defs>
    <marker id="arr31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1d3550">Один код — две независимые проверки</text>

  <rect x="240" y="52" width="300" height="64" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="390" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3550">Исходный код</text>
  <text x="390" y="100" text-anchor="middle" font-size="14" fill="#1d3550">def f(x: int) -&gt; int</text>

  <line x1="390" y1="116" x2="390" y2="136" stroke="#33557a" stroke-width="2"/>
  <line x1="170" y1="136" x2="610" y2="136" stroke="#33557a" stroke-width="2"/>
  <line x1="170" y1="136" x2="170" y2="158" stroke="#33557a" stroke-width="2" marker-end="url(#arr31)"/>
  <line x1="610" y1="136" x2="610" y2="158" stroke="#33557a" stroke-width="2" marker-end="url(#arr31)"/>

  <rect x="40" y="160" width="260" height="124" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="56" y="186" font-size="14" font-weight="bold" fill="#1d3550">mypy — статический анализ</text>
  <text x="56" y="212" font-size="13" fill="#1d3550">читает код, не исполняя его</text>
  <text x="56" y="234" font-size="13" fill="#1d3550">выводит типы выражений</text>
  <text x="56" y="256" font-size="13" fill="#1d3550">находит несовместимые типы</text>
  <text x="56" y="274" font-size="12" fill="#33557a">до первого запуска программы</text>

  <rect x="480" y="160" width="260" height="124" rx="10" fill="#ffffff" stroke="#33557a" stroke-width="2"/>
  <text x="496" y="186" font-size="14" font-weight="bold" fill="#1d3550">Интерпретатор Python</text>
  <text x="496" y="212" font-size="13" fill="#1d3550">исполняет код по инструкциям</text>
  <text x="496" y="234" font-size="13" fill="#1d3550">аннотации не проверяет</text>
  <text x="496" y="256" font-size="13" fill="#1d3550">тип виден только по значению</text>
  <text x="496" y="274" font-size="12" fill="#33557a">ошибка — в момент вызова</text>

  <rect x="40" y="322" width="260" height="76" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="56" y="348" font-size="13" font-weight="bold" fill="#4b3a16">Ошибка типов до запуска</text>
  <text x="56" y="370" font-size="12" fill="#4b3a16">можно исправить заранее</text>
  <text x="56" y="388" font-size="12" fill="#4b3a16">без исполнения опасного кода</text>

  <rect x="480" y="322" width="260" height="76" rx="10" fill="#f7f3ea" stroke="#8a6a2f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="496" y="348" font-size="13" font-weight="bold" fill="#4b3a16">Ошибка типа при выполнении</text>
  <text x="496" y="370" font-size="12" fill="#4b3a16">видна только на тех данных,</text>
  <text x="496" y="388" font-size="12" fill="#4b3a16">которые дошли до вызова</text>

  <text x="390" y="422" text-anchor="middle" font-size="12.5" fill="#33557a">Анализатор сужает пространство ошибок, тесты подтверждают поведение</text>
</svg>
