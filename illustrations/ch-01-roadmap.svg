<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img"
     aria-labelledby="rt rtd" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title id="rt">Карта книги: десять частей и путь читателя</title>
  <desc id="rtd">Книга состоит из десяти частей: начало, функции и структура программы, коллекции и данные, итерация и функции высшего порядка, объектно-ориентированное программирование, типизация и инструменты, практическая разработка, внутреннее устройство, инженерия и сопровождение, проекты. Части идут сверху вниз, от основ к прикладным проектам.</desc>

  <text x="30" y="34" font-size="18" font-weight="bold" fill="#1d3550">Путь по книге: от первого вычисления до проекта</text>

  <!-- вертикальная линия пути -->
  <line x1="70" y1="70" x2="70" y2="470" stroke="#9aa7b5" stroke-width="3"/>

  <!-- 1 -->
  <circle cx="70" cy="86" r="12" fill="#33557a"/>
  <text x="98" y="82" font-size="15" font-weight="bold" fill="#1d3550">Часть 1. Начало</text>
  <text x="98" y="102" font-size="13" fill="#33557a">язык, среда, вычисления, имена, условия, циклы, функции</text>

  <!-- 2 -->
  <circle cx="70" cy="128" r="12" fill="#33557a"/>
  <text x="98" y="124" font-size="15" font-weight="bold" fill="#1d3550">Часть 2. Функции и структура программы</text>
  <text x="98" y="144" font-size="13" fill="#33557a">стек вызовов, модули, исключения, отладка</text>

  <!-- 3 -->
  <circle cx="70" cy="170" r="12" fill="#33557a"/>
  <text x="98" y="166" font-size="15" font-weight="bold" fill="#1d3550">Часть 3. Коллекции и данные</text>
  <text x="98" y="186" font-size="13" fill="#33557a">списки, кортежи, строки, множества, словари, копирование, файлы</text>

  <!-- 4 -->
  <circle cx="70" cy="212" r="12" fill="#33557a"/>
  <text x="98" y="208" font-size="15" font-weight="bold" fill="#1d3550">Часть 4. Итерация и функции высшего порядка</text>
  <text x="98" y="228" font-size="13" fill="#33557a">итераторы, генераторы, замыкания, декораторы, включения</text>

  <!-- 5 -->
  <circle cx="70" cy="254" r="12" fill="#33557a"/>
  <text x="98" y="250" font-size="15" font-weight="bold" fill="#1d3550">Часть 5. Объектно-ориентированное программирование</text>
  <text x="98" y="270" font-size="13" fill="#33557a">классы, свойства, наследование, dunder-методы, dataclasses</text>

  <!-- 6 -->
  <circle cx="70" cy="296" r="12" fill="#33557a"/>
  <text x="98" y="292" font-size="15" font-weight="bold" fill="#1d3550">Часть 6. Типизация, тестирование, инструменты</text>
  <text x="98" y="312" font-size="13" fill="#33557a">аннотации, pytest, pyproject, линтеры</text>

  <!-- 7 -->
  <circle cx="70" cy="338" r="12" fill="#33557a"/>
  <text x="98" y="334" font-size="15" font-weight="bold" fill="#1d3550">Часть 7. Практическая разработка</text>
  <text x="98" y="354" font-size="13" fill="#33557a">stdlib, ОС и сеть, SQLite, время и логи, конкурентность, asyncio</text>

  <!-- 8 -->
  <circle cx="70" cy="380" r="12" fill="#8a6a2f"/>
  <text x="98" y="376" font-size="15" font-weight="bold" fill="#4b3a16">Часть 8. Внутреннее устройство</text>
  <text x="98" y="396" font-size="13" fill="#4b3a16">байткод, память, сборка мусора, дескрипторы, метаклассы</text>

  <!-- 9 -->
  <circle cx="70" cy="422" r="12" fill="#8a6a2f"/>
  <text x="98" y="418" font-size="15" font-weight="bold" fill="#4b3a16">Часть 9. Инженерия и сопровождение</text>
  <text x="98" y="438" font-size="13" fill="#4b3a16">архитектура, SOLID, Git, CI, релизы</text>

  <!-- 10 -->
  <circle cx="70" cy="464" r="12" fill="#2f6b3a"/>
  <text x="98" y="460" font-size="15" font-weight="bold" fill="#204a28">Часть 10. Проекты</text>
  <text x="98" y="480" font-size="13" fill="#204a28">CLI-приложение, HTTP API с базой данных, асинхронный сборщик</text>

  <!-- рамка «как читать» -->
  <rect x="600" y="60" width="240" height="214" rx="10" fill="#eef4fb" stroke="#33557a" stroke-width="2"/>
  <text x="618" y="88" font-size="15" font-weight="bold" fill="#1d3550">Как читать</text>
  <text x="618" y="114" font-size="13" fill="#1d3550">1. Читайте по порядку.</text>
  <text x="618" y="134" font-size="13" fill="#1d3550">2. Запускайте все примеры.</text>
  <text x="618" y="154" font-size="13" fill="#1d3550">3. Решайте упражнения</text>
  <text x="618" y="172" font-size="13" fill="#1d3550">   до чтения решений.</text>
  <text x="618" y="192" font-size="13" fill="#1d3550">4. Ошибки — часть работы:</text>
  <text x="618" y="210" font-size="13" fill="#1d3550">   читайте сообщения.</text>
  <text x="618" y="238" font-size="12.5" fill="#33557a">Всё проверяется запуском.</text>
</svg>
